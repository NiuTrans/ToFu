{{- if .Values.roles.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tofu.fullname" . }}
  labels:
{{ include "tofu.labels" . | indent 4 }}
{{- with .Values.service.annotations }}
  annotations:
{{ toYaml .Values.service.annotations | indent 4 }}
{{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
{{ include "tofu.selectorLabels" (dict "root" . "role" "api") | indent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
