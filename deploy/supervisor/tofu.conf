; ════════════════════════════════════════════════════════════════════════════
;  tofu.conf — system-supervisord program for the Tofu server on :15000
; ════════════════════════════════════════════════════════════════════════════
;
;  WHY THIS EXISTS
;  ---------------
;  The Tofu server was repeatedly SIGTERM'd because it was launched as a
;  foreground/background child of a VS Code (code-server) integrated terminal:
;  when code-server reaps that terminal's session, the reap propagates to the
;  server. `setsid` in restart_15000.sh fixes the terminal-reap case, but a
;  plain detached process is STILL not restarted when the container OOM-kills
;  it (SIGKILL, untrappable) or it crashes. This program hands lifecycle to the
;  host's already-running supervisord (pid 1 chain, `/etc/supervisor/`), so the
;  server is (a) started on boot and (b) automatically relaunched after ANY
;  death — SIGTERM, SIGKILL/OOM, or crash. That is the durable "stop it from
;  staying dead" fix.
;
;  INSTALL  (conf.d is root-owned; these need sudo — run them yourself)
;  --------
;    sudo cp deploy/supervisor/tofu.conf /etc/supervisor/conf.d/tofu.conf
;    sudo supervisorctl reread          # parse the new file
;    sudo supervisorctl update          # add + start [program:tofu]
;    sudo supervisorctl status tofu     # expect: RUNNING
;
;  IMPORTANT — avoid a double-instance / instance-lock fight
;  ---------
;  Tofu enforces a single-instance flock on :15000. BEFORE `supervisorctl
;  update`, stop any hand-started server so supervisord owns the one true
;  instance:
;    - if it was started via restart_15000.sh / manual `python server.py`,
;      kill that PID first (see restart_15000.sh steps [1/5]-[2/5]);
;    - the server's stale-lock reclaim will free a leftover lock on the next
;      clean boot, but a LIVE hand-started process will hold the port and the
;      supervised one will abort. One owner only.
;
;  LOGS
;  ----
;  supervisord captures the process stdout/stderr to the file below. The app's
;  own structured logs (logs/app.log, error.log, …) are unchanged and still the
;  primary diagnostic surface; this file is just the boot/stdout tail.

[program:tofu]
; The env interpreter directly, so server.py does NOT re-exec into it (skips the
; _tofu_maybe_reexec_into_env hop). Port + all other config come from the
; project .env, which server.py auto-loads from its own directory on startup.
command=/path/to/your/project server.py
directory=/path/to/your/project
user=your-user

; ── lifecycle: start on boot, always relaunch after death ──
autostart=true
autorestart=true
; Boot does PG bootstrap + blueprint registration; only call it "started" once
; it has stayed up this long (avoids a crash-loop being reported as running).
startsecs=15
; Cap restart storms: if it dies >10 times inside startsecs it goes FATAL and
; stops retrying (so a genuinely broken build doesn't hammer the box forever).
startretries=10

; ── graceful stop: the server traps SIGTERM and quiesces in-flight tasks ──
stopsignal=TERM
; Give the graceful drain room before supervisord escalates to SIGKILL.
stopwaitsecs=30
; The server spawns MCP subprocesses + a thread pool; send stop/kill to the
; whole process group so no orphaned children survive a stop/restart.
stopasgroup=true
killasgroup=true

; ── environment ──
; PORT is redundant with .env (PORT=15000) but pinned here so the bind is
; deterministic even if .env drifts. HOME is required for ~/.config, tokens,
; caches. .env supplies PG_*, TOFU_*, and the rest.
;
; CHROMIUM_EXTRA_LIB_DIRS + FONTCONFIG_* (2026-08-03): headless-Chromium's
; .so reads MUST resolve from LOCAL disk, not the FUSE-mounted conda env —
; beegfs-fuse intermittently fails reads under pressure ('libatk-1.0.so.0:
; cannot open shared object file' launch storms alternating with successes
; under a CONSTANT process env; the libs were never missing). restart_15000.sh
; exports the same override; chromium_env.chromium_lib_dirs() honors it FIRST
; and unfiltered, and tofu_search's standalone fallback reads it too. This
; line is the ONLY way the variable reaches a supervisord-launched server —
; the restart script REFUSES to run while this program owns tofu, so if the
; variable is missing here the FUSE fix silently evaporates on this launcher.
; Path follows the TOFU_BROWSER_LIBS_DIR convention (default
; $HOME/tofu-browser-libs); keep the two launchers in sync — pinned by
; tests/test_restart_chromium_libs_parity.py.
environment=PORT="15000",BIND_HOST="0.0.0.0",HOME="/home/your-user",LANG="en_US.UTF-8",LC_ALL="en_US.UTF-8",TOFU_SERVER_WORKER="1",TOFU_MANAGED_BY="root-supervisord",CHROMIUM_EXTRA_LIB_DIRS="/home/your-user/tofu-browser-libs/lib",FONTCONFIG_PATH="/home/your-user/tofu-browser-libs/etc/fonts",FONTCONFIG_FILE="/home/your-user/tofu-browser-libs/etc/fonts/fonts.conf"

; ── logging ──
redirect_stderr=true
stdout_logfile=/path/to/your/project
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; Higher priority number = started later (after infra agents already present).
priority=500
