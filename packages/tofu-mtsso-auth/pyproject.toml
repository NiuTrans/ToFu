[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tofu-mtsso-auth"
version = "0.3.0"
requires-python = ">=3.10"
description = "Bounded official MTSSO adapter with shared SDK-owned user sessions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tofu_mtsso_auth = ["*.mjs"]
