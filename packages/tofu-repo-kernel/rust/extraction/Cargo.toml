[package]
name = "tofu-repository-extraction"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT AND Apache-2.0"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tree-sitter-language-pack = { version = "=1.20.0", default-features = false, features = ["dynamic-loading"] }
tree-sitter = "=0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"
libloading = "=0.9.0"
libc = "=0.2.190"
tofu-repository-discovery = { path = "../discovery" }

[[bin]]
name = "tofu-repository-stream"
path = "src/stream_main.rs"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
tempfile = "=3.27.0"
