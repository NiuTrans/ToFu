<!doctype html>
<html lang="en" data-theme="tofu">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Native rich responses · Tofu UI kit</title>
<link rel="stylesheet" href="../../frontend/src/styles/fonts.css">
<link rel="stylesheet" href="../../static/styles.css">
<style>
/* Derived from the gallery scaffold: geometry only, existing kit and tokens. */
body{height:auto;overflow:auto;display:block;background:var(--bg-primary)}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{border-right:var(--control-edge-inset) solid var(--border);background:var(--bg-secondary);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)}
.brand{font-family:var(--font-ui);font-weight:var(--weight-bold);font-size:var(--font-size-xl);color:var(--text-primary)}
.main{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
.page-title{font-family:var(--font-ui);font-size:var(--font-size-3xl);font-weight:var(--weight-bold);color:var(--text-primary);margin:0}
.side p{color:var(--text-secondary);font-size:var(--font-size-sm);line-height:var(--leading-body)}
#gallery-actions{display:flex;gap:var(--space-2);flex-wrap:wrap}
@media(max-width:720px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:var(--space-3)}}
</style></head>
<body data-theme="tofu"><div class="shell">
<aside class="side"><div class="brand">Tofu · Rich responses</div><p>Content → validated data → trusted native components.</p><p>All seven block families. Read-only actions. Explicit evidence and failed budgets.</p><p>This design surface is a review fixture, not a new application state store.</p></aside>
<main class="main"><h1 class="page-title">Native response review</h1><div id="gallery-actions"></div><section id="rich-preview" aria-label="Native comparison report"></section></main>
</div><script type="module" src="./rich-response.bundle.js"></script></body></html>
