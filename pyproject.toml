[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tofu"
version = "0.16.0"
description = "Tofu (豆腐) — Self-hosted AI assistant with Quart backend and vanilla JS frontend"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dynamic = ["dependencies"]

[project.optional-dependencies]
# `test` is the extra CI installs (`pip install -e ".[test]"`). It carries the
# test runner + its plugins ONLY — no linters — so a test job pulls exactly
# what it needs. pytest itself lives HERE (it is NOT in requirements.txt), so
# this extra must exist for CI to have a runner at all.
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # The external mock LLM process in tests/mock_llm_server.py intentionally
    # remains a tiny Flask fixture; Flask is not part of the application
    # runtime anymore.
    "flask>=3.0",
    # Parallel test execution across worker processes. The suite is ~5400
    # tests; running it serially is the dominant CI wall-time cost. Each xdist
    # worker is its own process → its own session fixtures → its own throwaway
    # SQLite DB (conftest mkdtemps per session), so parallelism is isolation-safe.
    "pytest-xdist>=3.0",
    # Per-test hang guard so one wedged test can't stall the whole job to the
    # CI ceiling. Use the `signal` method (default on POSIX) — the `thread`
    # method mis-fires on the endpoint-loop tests.
    "pytest-timeout>=2.1",
    # In-memory Redis for exercising the redis-backed runtime-state store +
    # push bus (Epics B/C/D) against a REAL redis-py client without a live
    # server. Test-only; the runtime `redis` dep it pulls is NOT core.
    "fakeredis>=2.20",
    # Tiny pure-python CSS parser used by tests/test_frontend_icon_box_alignment.py
    # (parses styles.css rules instead of regex). Without it that module died at
    # COLLECTION with ModuleNotFoundError in every CI lane (2026-08-05).
    "tinycss2>=1.2",
]
dev = [
    # Superset of `test` plus the linter — the local contributor extra.
    "tofu[test]",
    "ruff",
]
# Optional horizontal-scale extra: the cross-replica runtime-state backend
# (TOFU_RUNTIME_STATE_BACKEND=redis) + push fan-out. Redis is NOT a core
# dependency — a single-box install runs the inproc default with zero extra
# packages. `pip install tofu[scale]` pulls the client for a multi-replica
# deployment.
scale = [
    "redis>=4.3",
]
# Optional trading subsystem — extracted into its own package. `pip install
# tofu[trading]` pulls it in; it self-mounts via the tofu.blueprints /
# tofu.schema / tofu.flags / tofu.startup entry-point groups.
trading = [
    "tofu-trading>=0.1,<0.2",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
# Ship the importable Python packages. The in-process façade (`tofu`) and the
# kernel it calls (`lib.tasks_pkg.entry`) require `lib*` and `routes*` to be
# importable; `tofu*` is the supported public surface.
include = ["tofu*", "lib*", "routes*", "rootless_vm*"]
exclude = ["tests*", "benchmarks*", "debug*", "clients*", "desktop*",
           "browser_extension*", "docs*", "promo*", "propaganda*",
           "swebench_rerun_workdir*", "outputs*", "paper*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# `-p no:napari` blocks an unrelated plugin leaked in by the host Python
# environment. Its napari -> vispy import chain raises ``OSError: GL ES 2.0
# library not found`` on headless machines before Tofu collection begins. Keep
# this in project addopts as well as the Makefile so a direct
# ``python -m pytest`` is equally hermetic.
#
# `-p no:timeout` MUST precede/accompany the explicit load: with entry-point
# autoload ON (a bare `pytest`, exactly what public CI runs) pytest-timeout's
# entrypoint registers the module as 'timeout', and the explicit
# `-p pytest_timeout` then re-registers the same module under a second name →
# ValueError: Plugin already registered under a different name (bitten
# 2026-08-05 on the first push carrying this addopts — every CI test leg died
# at startup). Blocking the 'timeout' name keeps exactly one registration in
# both worlds (autoload on OR PYTEST_DISABLE_PLUGIN_AUTOLOAD=1).
addopts = "-v --tb=short --strict-markers -p no:napari -p no:timeout -p pytest_timeout"
# Per-test hang guard. pytest-timeout has been an installed, DECLARED dep for
# a while, but with no default configured it never fired — measured
# 2026-07-27: a sleep(600) test ran until an EXTERNAL kill stopped the shell,
# with pytest emitting no verdict at all. That silently un-verifies every
# hang-shaped NEUTER in the suite (deleting the agent-loop no-progress
# breaker makes its test HANG rather than fail, because the breaker is the
# only exit from an infinite dispatcher).
#
# 300s is well above the slowest healthy tests here (jsdom harnesses,
# PDF/VLM parsing, live_server boots) and far below any wedged loop.
# `-p pytest_timeout` above is load-bearing: this suite is normally run with
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1, which turns off entry-point autoloading,
# so without naming the plugin the setting below is inert.
# Use the `signal` method (default on POSIX) — the `thread` method mis-fires
# on the endpoint-loop tests. Override per-test with @pytest.mark.timeout(N).
timeout = 300
markers = [
    "unit: Pure unit tests (no server, no DB)",
    "api: API integration tests (requires PostgreSQL)",
    "visual: Visual E2E tests (requires live server + Chromium)",
    "slow: Long-running tests (opt-in)",
    "timeout(seconds): Override the default pytest-timeout deadline for a test.",
    "ci_serial: Timing/concurrency-sensitive suites that assert locking or race behavior — CI and parallel Makefile targets run them in a dedicated SERIAL step (no xdist) because an oversubscribed runner starves their writer/heartbeat windows into false 'database is locked' / timeout reds (measured f0a930e→e65e14f). JOBS=0 keeps the whole target serial.",
    "live_llm: Hits the real LLM API (costs money, needs creds). Manual-only; gated by TOFU_PARITY_LIVE=1.",
]
