# ═══════════════════════════════════════════════════════════════
#  Tofu (豆腐) — Docker Compose
# ═══════════════════════════════════════════════════════════════
#
#  Quick start:
#    docker compose up -d
#
#  With API key pre-configured:
#    LLM_API_KEYS=sk-xxx docker compose up -d
#
#  View logs:
#    docker compose logs -f tofu
#
#  Stop:
#    docker compose down
#
#  Upgrade:
#    docker compose pull && docker compose up -d
#
# ═══════════════════════════════════════════════════════════════

services:
  tofu:
    build: .
    # image: ghcr.io/rangehow/tofu:latest  # uncomment after publishing
    container_name: tofu
    restart: unless-stopped
    # PID 1 reaps MCP/browser children; bounded resources make failure local
    # and let the in-process soft/hard RSS guards act before the kernel does.
    init: true
    mem_limit: ${TOFU_MEMORY_LIMIT:-8g}
    mem_reservation: ${TOFU_MEMORY_RESERVATION:-2g}
    pids_limit: ${TOFU_PIDS_LIMIT:-1024}
    stop_grace_period: 45s
    ports:
      - "${PORT:-15000}:15000"
    volumes:
      # Persistent data — database, configs, uploads survive restarts
      - tofu-data:/app/data
      - tofu-logs:/app/logs
      - tofu-uploads:/app/uploads
      # Optional distinct volume, still mounted at the mandated project-local
      # data/backups path.
      - "${TOFU_BACKUP_VOLUME:-tofu-backups}:/app/data/backups"
    environment:
      - PORT=15000
      - BIND_HOST=0.0.0.0
      # Earlier pressure gates for a dedicated, memory-bounded container.
      - TOFU_CGROUP_RELIEF_PCT=${TOFU_CGROUP_RELIEF_PCT:-85}
      - TOFU_CGROUP_REQUEST_PCT=${TOFU_CGROUP_REQUEST_PCT:-90}
      - TOFU_ADMISSION_CGROUP_PCT=${TOFU_ADMISSION_CGROUP_PCT:-90}
      - TOFU_PROCESS_RSS_RELIEF_MB=${TOFU_PROCESS_RSS_RELIEF_MB:-}
      - TOFU_PROCESS_RSS_RECYCLE_MB=${TOFU_PROCESS_RSS_RECYCLE_MB:-}
      # ── LLM API (optional — can also configure via Settings UI) ──
      - LLM_API_KEYS=${LLM_API_KEYS:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # ── Storage Sidecar backend (exact selector; no fallback) ──
      - TOFU_DB_BACKEND=${TOFU_DB_BACKEND:-sqlite}
      # ── Proxy (if needed) ──
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - PROXY_BYPASS_DOMAINS=${PROXY_BYPASS_DOMAINS:-}
      # ── Feishu bot (optional) ──
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      # ── Trading (disabled by default) ──
      - TRADING_ENABLED=${TRADING_ENABLED:-0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:15000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  tofu-data:
  tofu-logs:
  tofu-uploads:
  tofu-backups:
