<!doctype html>
<!--
  debug/task_mode_preview.html — standalone visual harness for Task Mode.

  Loads the REAL static/styles.css (so theme tokens resolve exactly like the
  app) and the REAL static/js/task-mode.js. Stubs only the few symbols that
  normally live in orchestration.js (the node catalogues + icon helpers) and a
  canned Api.orchestrations.* so the viewer renders a representative run with
  NO backend. Purely for eyeballing/screenshotting the design — not shipped,
  not bundled.

  Open with ?theme=dark to preview the dark palette.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Mode — visual preview</title>
  <link rel="stylesheet" href="../static/styles.css">
  <style>html,body{margin:0;height:100%;background:var(--bg-primary)}</style>
</head>
<body>
<script>
  // ── Theme toggle: default light, ?theme=dark for the dark palette ──
  (function () {
    var t = new URLSearchParams(location.search).get('theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.body.setAttribute('data-theme', t);
  })();

  // ── Minimal stubs of the orchestration.js symbols task-mode.js reads ──
  function escapeHtml(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  var _orchSvg = function (inner) {
    return '<svg class="orch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  };
  var _ORCH_ICONS = {
    rocket: _orchSvg('<path d="M5 15c-1 1-1.5 4-1.5 4s3-.5 4-1.5"/><path d="M9 11a12 12 0 0 1 8-8c2 0 3 1 3 3a12 12 0 0 1-8 8z"/><path d="M9 11l-3 1 3 5 1-3"/><circle cx="14.5" cy="9.5" r="1.5"/>'),
    loop: _orchSvg('<path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>'),
    reject: _orchSvg('<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>'),
    check: '<svg class="orch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>',
    warn: _orchSvg('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'),
    person: _orchSvg('<circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>'),
    flag: _orchSvg('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
    bot: _orchSvg('<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V5M9 4h6"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/>'),
    compass: _orchSvg('<circle cx="12" cy="12" r="9"/><path d="M16 8l-2 6-6 2 2-6z"/>'),
    package: _orchSvg('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),
    branch: _orchSvg('<circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 12h3M11 11l5-4M11 13l5 4"/>'),
    fanout: _orchSvg('<circle cx="6" cy="12" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="M8 12h2M11 11l5-5M11 13l5 5"/>'),
    stop: '<svg class="orch-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
    eye: _orchSvg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>')
  };
  var _ORCH_GLYPHS = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    loop: _ORCH_ICONS.loop, fanout: _ORCH_ICONS.fanout,
    join: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 5l5 6M8 12h2M8 19l5-6"/></svg>',
    branch: _ORCH_ICONS.branch,
    stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
    artifact: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>',
    human: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>',
    group: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3" stroke-dasharray="4 3"/></svg>'
  };
  var _ORCH_ROLES = [
    { role: 'planner', label: 'Planner', icon: 'tofu-planner.svg' },
    { role: 'worker',  label: 'Worker',  icon: 'tofu-worker.svg' },
    { role: 'critic',  label: 'Critic',  icon: 'tofu-critic.svg' },
    { role: 'researcher', label: 'Researcher', icon: 'tofu-researcher' }
  ];
  var _ORCH_CONTROLS = [
    { kind: 'start', label: 'Start', glyph: 'play', accent: '#10b981' },
    { kind: 'loop', label: 'Loop', glyph: 'loop', accent: '#6e56cf' },
    { kind: 'human', label: 'Human', glyph: 'human', accent: '#0ea5e9' },
    { kind: 'stop', label: 'Stop', glyph: 'stop', accent: '#ef4444' }
  ];
  var BASE_PATH = '';
  function _orchIconBase(){return '/static/icons';}
  function _orchIconSrc(icon){var n=icon||'tofu-general';var f=/\.\w+$/.test(n)?n:n+'.png';return _orchIconBase()+'/'+f;}
  function _orchToast(){}

  // ── Canned run: a résumé-screening flow paused on an approval gate ──
  var DEF = {
    schema: 'tofu.orchestration/v1', name: 'Résumé Screener',
    nodes: [
      { id: 's1', type: 'control', kind: 'start', name: 'Intake', pos: { x: 40, y: 30 } },
      { id: 'p1', type: 'role', role: 'planner', pos: { x: 40, y: 170 } },
      { id: 'l1', type: 'control', kind: 'loop', params: { max_iterations: 12 }, pos: { x: 40, y: 310 } },
      { id: 'w1', type: 'role', role: 'worker', params: { tier: 'heavy', isolation: 'shared-context' }, pos: { x: 270, y: 310 } },
      { id: 'c1', type: 'role', role: 'critic', pos: { x: 270, y: 170 } },
      { id: 'h1', type: 'control', kind: 'human', params: { mode: 'approve', prompt: 'Send outreach to the 12 shortlisted candidates?' }, pos: { x: 40, y: 450 } },
      { id: 'e1', type: 'control', kind: 'stop', name: 'Done', pos: { x: 40, y: 590 } }
    ],
    edges: [
      { from: 's1', to: 'p1' }, { from: 'p1', to: 'l1' }, { from: 'l1', to: 'w1' },
      { from: 'w1', to: 'c1' }, { from: 'c1', to: 'l1' }, { from: 'l1', to: 'h1' },
      { from: 'h1', to: 'e1' }
    ]
  };
  var RUN = {
    id: 'run_demo', orch_id: 'orch_x', name: 'Résumé Screener', status: 'paused',
    input: 'Screen the 240 résumés in /data/applicants and shortlist the strongest 12, then draft outreach.',
    definition: DEF, final: ''
  };
  var EVENTS = [
    { seq: 0, type: 'flow_start', name: 'Résumé Screener', nodes: 7 },
    { seq: 1, type: 'step_start', node_id: 'p1', role: 'planner', name: 'Planner', isolation: 'fresh' },
    { seq: 2, type: 'step_complete', node_id: 'p1', role: 'planner', preview: 'Brief: parse résumés → score on 5 criteria → shortlist top 12 → draft outreach.' },
    { seq: 3, type: 'loop_iteration', node_id: 'l1', iteration: 1, max: 12 },
    { seq: 4, type: 'step_start', node_id: 'w1', role: 'worker', name: 'Worker', isolation: 'shared-context' },
    { seq: 5, type: 'step_complete', node_id: 'w1', role: 'worker', preview: 'Parsed 240 résumés, scored, shortlisted 12 candidates.' },
    { seq: 6, type: 'step_start', node_id: 'c1', role: 'critic', name: 'Critic', isolation: 'fresh' },
    { seq: 7, type: 'step_complete', node_id: 'c1', role: 'critic', preview: 'Shortlist looks solid; criteria coverage complete.' },
    { seq: 8, type: 'human_request', node_id: 'h1', name: 'Outreach approval', mode: 'approve', prompt: 'Send outreach to the 12 shortlisted candidates?', request_id: 'orch_h1_1' }
  ];

  var Api = { orchestrations: {
    taskList: async () => ({ ok: true, runs: [
      RUN,
      { id: 'run_a', name: 'Daily Digest', status: 'done', created_at: Date.now() - 3600e3 },
      { id: 'run_b', name: 'Lead Enrichment', status: 'running', created_at: Date.now() - 600e3 },
      { id: 'run_c', name: 'Doc Refactor', status: 'error', created_at: Date.now() - 86400e3 }
    ] }),
    taskGet: async () => ({ ok: true, run: RUN }),
    taskEvents: async (id, cursor) => {
      var evs = EVENTS.filter(e => e.seq >= (cursor || 0));
      return { ok: true, events: evs, next_cursor: 9, status: 'paused', done: false };
    },
    humanApprove: async () => ({ ok: true }),
    humanInput: async () => ({ ok: true }),
    taskAbort: async () => ({ ok: true }),
    taskRemove: async () => true
  } };
</script>
<script src="../static/js/task-mode.js"></script>
<script>
  window.addEventListener('load', function () {
    openTaskMode();
    // Auto-open the paused demo run so the screenshot shows the full surface.
    setTimeout(function () { _tmOpenRun('run_demo'); }, 120);
  });
</script>
</body>
</html>
