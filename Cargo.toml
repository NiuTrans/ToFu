[workspace]
resolver = "2"
members = ["packages/tofu-runtime", "packages/tofu-runtime/vendor/rayon-core"]
# Existing engines/prototypes retain their independent lock/build authorities.
# Runtime trees are never members: launcher caches build third-party sdists
# under data/, and .tofu/ holds nested worktrees with their own roots.
exclude = ["packages/vendor/reqwest", "packages/tofu-db", "benchmarks/native_event", "benchmarks/context_compiler/native_json", "data", ".tofu"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
