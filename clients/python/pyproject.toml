[build-system]
requires = ["setuptools==80.10.2", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tofu-sdk"
version = "0.17.0"
description = "Sync and async Python client for the Tofu agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "requests>=2.28.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/rangehow/ToFu"
Documentation = "https://github.com/rangehow/ToFu/tree/main/clients/python"
Repository = "https://github.com/rangehow/ToFu"
Issues = "https://github.com/rangehow/ToFu/issues"

[project.optional-dependencies]
cli = ["click>=8.0.0"]

[project.scripts]
tofu = "tofu_sdk._cli:main"

[tool.setuptools.packages.find]
include = ["tofu_sdk*"]
