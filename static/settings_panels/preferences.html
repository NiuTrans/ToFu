        <div class="settings-tab-panel" id="settingsTab_preferences">
          <div class="settings-section-title" data-i18n="prefsPanel.title">个人偏好档案</div>
          <p class="settings-desc" data-i18n="prefsPanel.intro">
            这是助手长期记住的关于你、以及「你希望它如何工作」的信息（语言、语气、编码习惯、禁忌，以及你的角色、技术栈等）。它会在每次对话中自动注入，跨项目生效。助手会在对话中自动学习并更新这些条目，你可以随时在此修改或删除。
          </p>

          <!-- Per-item editable preference list, grouped by section -->
          <div id="prefsList" class="prefs-list"></div>

            <span id="prefsCharCount" class="stg-badge" style="font-size:11px;">0 / 2500</span>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-secondary btn-sm" onclick="refreshPreferences()" data-i18n="prefsPanel.reload">重新加载</button>
              <button class="btn btn-primary btn-sm" onclick="savePreferences(this)" data-i18n="prefsPanel.save">保存</button>
            </div>
          </div>
          <div id="prefsStatus" class="settings-desc" style="font-size:12px;margin-top:6px;"></div>

          <div class="settings-section-divider"></div>
          <div class="settings-row" style="justify-content:space-between;align-items:center;">
            <div class="settings-section-title" data-i18n="memPrefs.memTitle">积累的记忆</div>
            <button class="btn btn-secondary btn-sm" onclick="openMemoryModal()" data-i18n="memPrefs.manageAll">管理全部</button>
          </div>
          <p class="settings-desc" data-i18n="memPrefs.memIntro">

          </p>
          <div id="prefsMemoryList" class="memory-list memory-list-embedded"></div>
