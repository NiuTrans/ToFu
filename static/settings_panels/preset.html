        <div class="settings-tab-panel" id="settingsTab_preset">
          <div class="stg-section-head">
            <div class="settings-section-title" data-i18n="settings.imageGen">图片生成</div>
            <div class="stg-section-actions">
              <button class="stg-btn-secondary btn-xs" data-tofu-action="_toggleAllIgModels(true)" data-i18n="settings.showAll">全部显示</button>
              <button class="stg-btn-secondary btn-xs" data-tofu-action="_toggleAllIgModels(false)" data-i18n="settings.hideAll">全部隐藏</button>
            </div>
          </div>
          <p class="settings-desc" data-i18n="settings.igDesc">选择在图片生成选择器中显示哪些模型。隐藏的模型仍然可用，只是不会出现在选择器中。</p>
          <div id="stgIgVisibility" class="stg-dropdown-visibility">

          </div>

          <div class="settings-divider"></div>
          <div class="stg-section-head">
            <div class="settings-section-title" data-i18n="settings.modelDropdown">模型下拉列表</div>
            <div class="stg-section-actions">
              <button class="stg-btn-secondary btn-xs" data-tofu-action="_probeAllDropdownModels()" data-i18n="settings.probeAllModels" data-i18n-title="settings.probeAllModelsTitle" id="stgProbeAllModelsBtn">测试全部</button>
              <button class="stg-btn-secondary btn-xs" data-tofu-action="_toggleAllDropdownModels(true)" data-i18n="settings.showAll">全部显示</button>
              <button class="stg-btn-secondary btn-xs" data-tofu-action="_toggleAllDropdownModels(false)" data-i18n="settings.hideAll">全部隐藏</button>
            </div>
          </div>
          <p class="settings-desc" data-i18n="settings.modelDropdownDesc">选择在模型切换下拉列表中显示哪些模型。隐藏的模型仍然可用，只是不会出现在下拉列表中。</p>
          <div class="stg-dv-legend">
            <span class="stg-dv-legend-item"><span class="stg-dv-health-dot mh-ok"></span><span data-i18n="settings.dhOk">测试通过</span></span>
            <span class="stg-dv-legend-item"><span class="stg-dv-health-dot mh-degraded"></span><span data-i18n="settings.dhDegraded">部分线路可用</span></span>
            <span class="stg-dv-legend-item"><span class="stg-dv-health-dot mh-unverified"></span><span data-i18n="settings.dhUnverified">未验证</span></span>
            <span class="stg-dv-legend-item"><span class="stg-dv-health-dot mh-down"></span><span data-i18n="settings.dhDown">测试失败</span></span>
            <span class="stg-dv-legend-item"><span class="stg-dv-health-dot"></span><span data-i18n="settings.mhNeverProbed">未测试</span></span>
            <span class="stg-dv-legend-item"><span class="stg-dv-health-dot mh-stale"></span><span data-i18n="settings.dhStale">结果已过期</span></span>
          </div>
          <div id="stgDropdownVisibility" class="stg-dropdown-visibility">
            <!-- JS renders model toggles -->
          </div>

          <div class="settings-divider"></div>
          <div class="settings-section-title" data-i18n="settings.modelDefaults">模型默认</div>
          <p class="settings-desc" data-i18n="settings.modelDefaultsDesc">配置自动回退模型和预设的默认模型。当主模型请求失败时，系统将自动切换到回退模型继续生成。预设默认模型用于快捷切换时的模型选择。留空表示禁用或使用系统默认。</p>
          <div class="settings-group">
            <div class="settings-row two-col">
              <div class="settings-field">
                <label data-i18n-html="settings.fallbackModelFull">回退模型 <span style="color:var(--text-tertiary);font-weight:normal">（主模型失败时自动切换）</span></label>
                <select id="settingFallbackModel" class="settings-select">
                  <option value="" data-i18n="settings.disableFallback">（禁用自动回退）</option>
                  <!-- JS populates from available models -->
                </select>
              </div>
              <div class="settings-field">
                <label data-i18n-html="settings.defaultModelFull">默认模型 <span style="color:var(--text-tertiary);font-weight:normal">（LLM_MODEL）</span></label>
                <select id="settingDefaultModel" class="settings-select">
                  <option value="" data-i18n="settings.useEnvVar">（使用环境变量）</option>
                  <!-- JS populates from available models -->
                </select>
              </div>
            </div>

          </div>
