        <div class="settings-tab-panel" id="settingsTab_skills">
          <!-- Header: title · counts · scope tabs · search
               (same control order as the MCP store header — one header
               language across both store tabs) -->
          <div class="mcp-store-header">
            <div class="mcp-store-header-title">
              <span class="settings-section-title" data-i18n="skills.title">Skills</span>
              <span class="stg-badge" id="skillsTotalCount">0 installed</span>
              <span class="stg-badge" id="skillsCatalogCount" style="display:none;">0 in catalog</span>
            </div>
            <div class="mcp-store-header-spacer"></div>
            <div class="skills-scope-tabs">
              <button class="skills-scope-tab active" data-scope="catalog" data-tofu-action="_skillsSetScope('catalog')" data-i18n="skills.tabCatalog">市场</button>
              <button class="skills-scope-tab" data-scope="installed" data-tofu-action="_skillsSetScope('installed')" data-i18n="skills.tabInstalled">已安装</button>
            </div>
            <input type="text" class="mcp-search" id="skillsSearch" placeholder="搜索 Skills…" data-i18n-placeholder="skills.searchPh"
                   data-tofu-action-input="_skillsFilter(this.value)">
          </div>

          <p class="settings-desc skills-intro" data-i18n="skills.intro">
            Skills 是 Claude / OpenClaw / AgentSkills 标准的可重用知识包（SKILL.md + references/scripts/）。可拖入 .zip 或一键安装下方推荐。
          </p>

          <!-- Category filter pills (catalog mode) -->
          <div class="mcp-category-bar" id="skillsCategoryBar"></div>

          <!-- Drag-and-drop zone (always visible, becomes prominent on dragover) -->
          <div class="skills-drop-zone" id="skillsDropZone" data-tofu-action="document.getElementById('skillsZipInput').click()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span class="skills-drop-zone-text" data-i18n="skills.dropZone">拖入 .zip 安装本地技能包，或点击选择文件</span>
            <input type="file" id="skillsZipInput" accept=".zip,application/zip" style="display:none" data-tofu-action-change="_skillsInstallFromInput(this)">
          </div>

          <!-- Catalog grid -->
          <div id="skillsCatalogGrid" class="mcp-catalog-grid">
            <p class="stg-loading" data-i18n="settings.loading">正在加载…</p>
          </div>
        </div>
