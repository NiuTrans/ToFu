        <div class="settings-tab-panel" id="settingsTab_network">
          <div class="settings-section-title" data-i18n="settings.proxyPoolTitle">代理池</div>
          <p class="settings-desc" data-i18n-html="settings.proxyPoolBody">粘贴完整代理链接。系统按顺序连接，失败自动切换；不添加则使用系统代理。</p>
          <div id="proxyEnvBanner" class="settings-hint-banner" style="display:none;margin-top:0;margin-bottom:12px">
            ℹ️ <span id="proxyEnvBannerText"></span>
          </div>
          <div class="settings-group proxy-pool-group">
            <div class="proxy-pool-toolbar">
              <span class="proxy-pool-meta">
                <span id="proxyPoolCount" class="proxy-pool-count">0 个代理</span>
                <span class="proxy-pool-meta-sep" aria-hidden="true">·</span>
                <span class="proxy-pool-order-hint" data-i18n="settings.proxyPoolOrderHint">从上到下按顺序尝试</span>
              </span>
              <button type="button" id="proxyPoolAddBtn" class="auth-src-btn sm"></button>
            </div>
            <div id="proxyPoolList"></div>
          </div>

          <div class="settings-divider"></div>
          <details class="proxy-bypass-section">
            <summary>
              <span class="proxy-bypass-summary-copy">
                <strong data-i18n="settings.proxyBypassTitle">直连规则</strong>
                <small data-i18n-html="settings.proxyBypassBody">域名或 URL 不经过代理</small>
              </span>
              <span id="proxyBypassCount" class="proxy-bypass-count">0 项</span>
            </summary>
            <div class="proxy-bypass-card">
              <div id="proxyBypassList" class="proxy-bypass-list"></div>
              <div class="proxy-bypass-footer">
                <button type="button" id="proxyBypassAddBtn" class="auth-src-btn ghost sm"></button>
                <details class="proxy-bypass-rules-help">
                  <summary data-i18n="settings.proxyBypassRules">查看匹配规则</summary>
                  <div>
                    <p><code>api.internal.example.com</code><span data-i18n="settings.proxyBypassExact">只匹配这个主机</span></p>
                    <p><code>.internal.example.com</code><span data-i18n="settings.proxyBypassSuffix">匹配该域名及其子域名</span></p>
                    <p data-i18n-html="settings.proxyBypassTipFull">也可以粘贴完整 URL，保存时会提取主机名。环境变量 <code>PROXY_BYPASS_DOMAINS</code> 会与这里合并。</p>
                  </div>
                </details>
              </div>
              <div id="proxyEnvHint" class="settings-hint-banner" style="display:none;margin-top:8px">
                ℹ️ <span id="proxyEnvHintText"></span>
              </div>
            </div>
          </details>
        </div>
