<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" width="120" height="48" preserveAspectRatio="none">
  <!-- FULL-HEIGHT painterly meadow (the bar's whole body, not a 17px strip).
       preserveAspectRatio="none" makes this 120-wide tile stretch to the bar's
       full height so grass fills top-to-bottom; density RISES toward the base
       and thins into a hazy atmosphere at the top where the frosted control
       pills float. THREE depth planes (far haze -> mid bank -> dense near
       blades), each a solid grass MASS with a bladed top edge (dense, not
       sparse strokes) and a VERTICAL gradient (dark wet base -> bright sunlit
       tip) so it reads as VOLUME, not flat clip-art. A stitched feTurbulence
       mottle adds the oily painterly grain. SEAM: every plane's profile starts
       and ends at the same y (x=0 == x=120), and the turbulence uses
       stitchTiles="stitch", so the 120px tile repeats with no seam (parallax-
       safe). Muted sage keeps it harmonious with the warm-cream tofu card. -->
  <defs>
    <!-- hazy atmosphere behind the pills: lightest at the very top for legibility -->
    <linearGradient id="mdw-atmo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5EA"/>
      <stop offset="0.6" stop-color="#E7EED9"/>
      <stop offset="1" stop-color="#DBE7C9"/>
    </linearGradient>
    <!-- far rolling land: pale, low-contrast (atmospheric perspective) -->
    <linearGradient id="mdw-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3D6AC"/>
      <stop offset="1" stop-color="#AEC697"/>
    </linearGradient>
    <!-- mid grass bank -->
    <linearGradient id="mdw-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3DCA7"/>
      <stop offset="0.6" stop-color="#A6C77E"/>
      <stop offset="1" stop-color="#7CA457"/>
    </linearGradient>
    <!-- dense near grass: bright sunlit tips -> dark wet base (the volume read) -->
    <linearGradient id="mdw-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FCB70"/>
      <stop offset="0.55" stop-color="#6E9C48"/>
      <stop offset="0.8" stop-color="#4C7233"/>
      <stop offset="1" stop-color="#37522A"/>
    </linearGradient>
    <!-- oily painterly grain: stitched fractal noise, tinted, low alpha. -->
    <filter id="mdw-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="mdw-oil" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.22" numOctaves="2"
                    seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
                     values="0 0 0 0 0.22
                             0 0 0 0 0.34
                             0 0 0 0 0.16
                             0 0 0 0.55 0"/>
    </filter>
  </defs>

  <!-- atmosphere fills the whole body (top area stays pale behind the pills) -->
  <rect x="0" y="0" width="120" height="48" fill="url(#mdw-atmo)"/>

  <!-- FAR plane: soft blurred hill silhouette (distant land) -->
  <path d="M0,13 C20,10 40,10 60,13 C80,16 100,10 120,13 L120,48 L0,48 Z"
        fill="url(#mdw-far)" opacity="0.85" filter="url(#mdw-soft)"/>

  <!-- MID plane: a denser bank of blades reaching into the middle -->
  <path fill="url(#mdw-mid)" d="M0,20 L6,14 L12,24 L18,15 L24,27 L30,13 L36,25 L42,16 L48,26 L54,14 L60,24 L66,15 L72,27 L78,13 L84,25 L90,16 L96,26 L102,14 L108,24 L114,15 L120,20 L120,48 L0,48 Z"/>

  <!-- NEAR plane: densest, darkest MASS kept in the lower body (below the
       vertically-centered pill band) so it can't crush label contrast; its
       bladed top still varies for a lush silhouette. -->
  <path fill="url(#mdw-near)" d="M0,33 L4,28 L8,34 L12,27 L16,33 L20,29 L24,35 L28,27 L32,33 L36,30 L40,34 L44,28 L48,33 L52,27 L56,34 L60,29 L64,33 L68,27 L72,35 L76,29 L80,33 L84,28 L88,34 L92,27 L96,33 L100,30 L104,34 L108,28 L112,33 L116,29 L120,33 L120,48 L0,48 Z"/>

  <!-- oily grain, restricted to the LOWER dense grass (below the pill band) so
       the painterly mottle never darkens the label zone. -->
  <rect x="0" y="30" width="120" height="18" fill="#000" opacity="0.42" filter="url(#mdw-oil)"/>

  <!-- a few tall individual blades poking into the haze -> organic reach, not a
       flat mass top. Kept inside [0,120] so they never straddle the seam. -->
  <g stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M26,30 C25.4,22 25,17 24.4,11" stroke="#6E9850" stroke-width="1.3"/>
    <path d="M27.6,30 C27.8,22 28,17 28.2,10" stroke="#82AE60" stroke-width="1.1"/>
    <path d="M69,29 C68.4,22 68,17 67.4,12" stroke="#6E9850" stroke-width="1.3"/>
    <path d="M70.8,29 C71,22 71.2,17 71.4,11" stroke="#82AE60" stroke-width="1.1"/>
    <path d="M101,30 C100.6,23 100.4,18 100,13" stroke="#6E9850" stroke-width="1.2"/>
  </g>

  <!-- specular sheen on some near-blade tips (the wet highlight) -->
  <g stroke-linecap="round" fill="none" stroke="#CFE6A6" opacity="0.55">
    <path d="M12,25 L12,21.6" stroke-width="1"/>
    <path d="M28,24 L28,20.6" stroke-width="1"/>
    <path d="M68,24 L68,20.6" stroke-width="1"/>
    <path d="M92,25 L92,21.6" stroke-width="1"/>
  </g>
</svg>
