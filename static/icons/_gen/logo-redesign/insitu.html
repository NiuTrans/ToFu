<!doctype html>
<html lang="zh" data-theme="tofu">
<head>
<meta charset="utf-8">
<title>Tofu</title>
<link rel="stylesheet" href="../../../vendor/google-fonts-local.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .tabbar { flex:0 0 auto; background:#E7DFCE; border-bottom:1px solid #D8CFBA;
            display:flex; align-items:flex-end; gap:6px; padding:8px 12px 0; }
  .tab { display:flex; align-items:center; gap:8px; background:#FAF7F0;
         border:1px solid #D8CFBA; border-bottom:none; border-radius:9px 9px 0 0;
         padding:7px 14px; font-size:12px; color:#4a4453; }
  .app { flex:1 1 auto; display:flex; min-height:0; }
  .sidebar { position:static; height:100%; }
  main { flex:1 1 auto; overflow:auto; display:flex; flex-direction:column; }
  .welcome { flex:1 1 auto; }
</style>
</head>
<body>
<div class="tabbar">
  <div class="tab"><img id="tabIcon" src="../../tofu-welcome.svg" width="16" height="16" alt=""><span>Tofu</span></div>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><img class="sidebar-tofu-icon" id="sideIcon" src="../../tofu-welcome.svg" alt="Tofu" width="22" height="22"><span class="sidebar-brand"><span class="sidebar-brand-t">T</span><span class="sidebar-brand-o">o</span><span class="sidebar-brand-f">f</span><span class="sidebar-brand-u">u</span></span></h1>
    </div>
  </aside>
  <main>
    <div class="welcome" id="welcome">
      <div class="welcome-icon"><img id="welIcon" src="../../tofu-welcome.svg" alt="Tofu" width="64" height="64"></div>
      <h2 class="tofu-brand"><span class="tofu-brand-t">T</span><span class="tofu-brand-o1">o</span><span class="tofu-brand-f">f</span><span class="tofu-brand-u">u</span><small>豆腐</small></h2>
      <div class="feature-pills">
        <span class="feature-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg><span>深度思考</span></span>
        <span class="feature-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>搜索</span></span>
        <span class="feature-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg><span>URL 抓取</span></span>
        <span class="feature-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-7 7"/></svg><span>图片输入</span></span>
        <span class="feature-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg><span>副驾驶</span></span>
        <span class="feature-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-4 1 2-5z"/></svg><span>浏览器</span></span>
      </div>
    </div>
  </main>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const icon = q.get('icon');
  if (icon) for (const id of ['tabIcon','sideIcon','welIcon']) document.getElementById(id).src = icon;
</script>
</body>
</html>
