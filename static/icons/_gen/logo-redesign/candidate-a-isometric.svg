<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="aTop" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FFFBF0"/>
      <stop offset="1" stop-color="#FBEED3"/>
    </linearGradient>
    <linearGradient id="aLeft" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FCF3DE"/>
      <stop offset="1" stop-color="#F4E0BC"/>
