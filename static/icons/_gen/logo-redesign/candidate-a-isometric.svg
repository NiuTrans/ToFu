  <path d="M15.5 15.6 L25.5 10.6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
  <path d="M27.8 9.4 L30.2 8.2" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
