  <path d="M32 7 L56 19 L56 43 L32 55 L8 43 L8 19 Z M8 19 L32 31 L56 19 M32 31 L32 55"
        fill="none" stroke="#221E2A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Face on the front-left face plane (skew-mapped 24x24 space) -->
  <g transform="matrix(1,0.5,0,1,8,19)">
    <rect x="2.6" y="4.0" width="7.2" height="10.6" rx="3.4" fill="#221E2A"/>
