    <ellipse cx="3.0" cy="17.6" rx="2.9" ry="1.65" fill="#FB9E96" opacity="0.8"/>
    <ellipse cx="21.0" cy="17.6" rx="2.9" ry="1.65" fill="#FB9E96" opacity="0.8"/>
