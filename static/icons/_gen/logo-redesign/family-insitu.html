<!doctype html>
<html lang="zh" data-theme="tofu">
<head>
<meta charset="utf-8">
<title>family in-situ</title>
<link rel="stylesheet" href="../../../frontend/src/styles/fonts.css">
<style>
  body { margin:0; background:#FAF7F0; color:#26222e;
         font-family:'Inter','Plus Jakarta Sans',system-ui,sans-serif; padding:28px 34px; }
  h1 { font-size:17px; margin:0 0 4px; }
  .sub { font-size:12px; color:#6b6474; margin-bottom:22px; }
  h2 { font-size:13px; color:#8a8296; font-weight:600; margin:20px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:inline-flex; align-items:center; gap:7px; background:#F4EFE5;
          border:1px solid #ECE6D9; border-radius:10px; padding:5px 11px 5px 7px; font-size:12.5px; }
  .chip img { display:block; }
  .chip .lbl { font-weight:600; }
  .old .chip { opacity:.75; }
  .tag { font-size:11px; color:#8a6d3b; background:#f7ead2; border-radius:20px;
         padding:2px 10px; margin-right:10px; }
  .avs { display:flex; gap:14px; align-items:flex-end; }
  .av { width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
  .av img { width:40px; height:40px; display:block; }
  .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .grid .cell { background:#F4EFE5; border:1px solid #ECE6D9; border-radius:10px;
                display:flex; flex-direction:column; align-items:center; padding:10px 6px 8px; gap:4px; }
  .cell small { font-size:11px; color:#8a8296; }
</style>
</head>
<body>
<h1>角色图标家族 — in-situ 验收</h1>
<div class="sub">A2 同源手写几何 + 各角色道具重绘 · 编排行内 22px(现行 vs 新家族对照) · 消息头像 40px · 96px 细节</div>

<h2><span class="tag">现行(VTracer 描摹)</span>编排行内 22px</h2>
<div class="chips old" id="oldChips"></div>
<h2><span class="tag">新家族(A2 同源)</span>编排行内 22px</h2>
<div class="chips" id="newChips"></div>

<h2>消息头像 40px(新家族)</h2>
<div class="avs" id="newAvs"></div>

<h2>96px 细节(新家族)</h2>
<div class="grid" id="newGrid"></div>

<script>
const ROLES = ['planner','worker','critic','thinking','browser','researcher','analyst','coder','general','router','synthesizer','writer'];
const OLD_SVG = new Set(['planner','worker','critic']);
const DIR = new URLSearchParams(location.search).get('dir') || 'family';
const oldSrc = r => OLD_SVG.has(r) ? `../../tofu-${r}.svg` : `../../tofu-${r}.png`;
const newSrc = r => `${DIR}/tofu-${r}.svg`;
document.getElementById('oldChips').innerHTML = ROLES.map(r =>
  `<span class="chip"><img src="${oldSrc(r)}" width="22" height="22"><span class="lbl">${r}</span></span>`).join('');
document.getElementById('newChips').innerHTML = ROLES.map(r =>
  `<span class="chip"><img src="${newSrc(r)}" width="22" height="22"><span class="lbl">${r}</span></span>`).join('');
document.getElementById('newAvs').innerHTML = ROLES.map(r =>
  `<span class="av"><img src="${newSrc(r)}"></span>`).join('');
document.getElementById('newGrid').innerHTML = ROLES.map(r =>
  `<div class="cell"><img src="${newSrc(r)}" width="96" height="96"><small>${r}</small></div>`).join('');
</script>
</body>
</html>
