<!doctype html>
<html lang="zh" data-theme="tofu">
<head>
<meta charset="utf-8">
<title>Tofu wordmark parity gate</title>
<!-- 生产 CSS,零复刻:任何字标规则都必须从 styles.css 本体解析出来 -->
<link rel="stylesheet" href="../../../vendor/google-fonts-local.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body{margin:0;background:#EDEAE2}
  .stage{display:flex;flex-direction:column;gap:0}
  .band{padding:0}
  .band-label{font:11px/1 ui-monospace,monospace;color:#8a8272;padding:10px 14px 6px}
  /* 侧栏真实容器几何 */
  .sidebar{position:static;width:280px;height:auto}
  /* 欢迎屏真实容器 */
  .welcome{min-height:0;padding:22px 0 26px}
  .measure{background:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="band">
    <div class="band-label">A · sidebar-header h1 (22px icon + .sidebar-brand)</div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1><img class="sidebar-tofu-icon" src="../../tofu-welcome.svg" alt="Tofu" width="22" height="22"><span class="sidebar-brand"><span class="sidebar-brand-t">T</span><span class="sidebar-brand-o">o</span><span class="sidebar-brand-f">f</span><span class="sidebar-brand-u">u</span></span></h1>
      </div>
    </aside>
  </div>
  <div class="band measure">
    <div class="band-label">B · welcome h2.tofu-brand (64px icon + .tofu-brand)</div>
    <div class="welcome" id="welcome">
      <div class="welcome-icon"><img src="../../tofu-welcome.svg" alt="Tofu" width="64" height="64"></div>
      <h2 class="tofu-brand"><span class="tofu-brand-t">T</span><span class="tofu-brand-o1">o</span><span class="tofu-brand-f">f</span><span class="tofu-brand-u">u</span><small>豆腐</small></h2>
    </div>
  </div>
</div>
</body>
</html>
