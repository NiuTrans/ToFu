      type: object
      additionalProperties: true
      required: [ok, conversationRevision]
      properties:
        ok: {const: true}
        conversationRevision: {type: integer, minimum: 0}
        cursor: {type: string}
        turn: {$ref: '#/components/schemas/TurnRecord'}
        turns:
          type: array
          items: {$ref: '#/components/schemas/TurnRecord'}
        deletedTurnIds:
          type: array
          items: {type: string}
    AbortAttemptResponse:
      type: object
      additionalProperties: true
      required: [ok]
      properties:
        ok: {const: true}
