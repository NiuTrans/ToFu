        transitions:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/RouteSnapshotTransition'}
        degradation_reasons:
          type: array
          maxItems: 16
          items: {type: string, maxLength: 256}
        recorded_at: {type: number, minimum: 0}
    TurnActivityEntry:
      type: object
      additionalProperties: false
      required: [id, spanId, seq, occurredAt, kind, status, severity, count]
      properties:
        id: {type: string, minLength: 1, maxLength: 160}
        spanId: {type: string, minLength: 1, maxLength: 160}
        parentSpanId: {type: string, maxLength: 160}
        seq: {type: integer, minimum: 0, maximum: 9007199254740991}
        occurredAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        startedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        endedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        kind:
          type: string
          enum: [model, tool, status, error, system]
        status:
          type: string
          enum: [started, running, waiting, succeeded, failed, skipped, switched, aborted]
        severity:
          type: string
          enum: [info, warning, error]
        summary: {type: string, maxLength: 180}
        summaryKey: {type: string, maxLength: 160}
        summaryArgs: {$ref: '#/components/schemas/JsonObject'}
        detail: {type: string, maxLength: 400}
        detailKey: {type: string, maxLength: 160}
        detailArgs: {$ref: '#/components/schemas/JsonObject'}
        roundNum: {type: integer, minimum: 0, maximum: 9007199254740991}
        # 0-based model round this entry is anchored to for inline display
        # (roundNum is the 1-based R{n} request-tag round; llmRound = roundNum - 1).
        llmRound: {type: integer, minimum: 0, maximum: 9007199254740991}
        model: {type: string, maxLength: 160}
        providerId: {type: string, maxLength: 160}
        toolName: {type: string, maxLength: 160}
        toolCallId: {type: string, maxLength: 160}
        reasonCode: {type: string, maxLength: 160}
        action: {type: string, maxLength: 48}
        fromModel: {type: string, maxLength: 160}
        toModel: {type: string, maxLength: 160}
        requestTag: {type: string, maxLength: 80}
        phase: {type: string, maxLength: 80}
        # A completed context-compaction entry is an inspectable Turn fact.
        # These fields intentionally carry accounting only; transcript/archive
        # payloads stay behind the owner-scoped compaction endpoint.
        archiveId: {type: string, maxLength: 160}
        trigger: {type: string, maxLength: 80}
        tokenCountKind: {type: string, maxLength: 24}
        tokensBefore: {type: integer, minimum: 0, maximum: 9007199254740991}
        tokensAfter: {type: integer, minimum: 0, maximum: 9007199254740991}
        messagesBefore: {type: integer, minimum: 0, maximum: 9007199254740991}
        messagesAfter: {type: integer, minimum: 0, maximum: 9007199254740991}
        reductionPercent: {type: integer, minimum: 0, maximum: 100}
        # 'occurrences' marks a coalesced retry/recovery row: durationMs is the
        # sum of actual backoffs, never one continuous wall-clock wait.
        timingMode: {type: string, maxLength: 24}
        # Credential-free model-route diagnostics on model completion rows.
        routeId: {type: string, maxLength: 160}
        routeMode: {type: string, maxLength: 24}
        routeDecision: {type: string, maxLength: 80}
        failureStage: {type: string, maxLength: 80}
        count: {type: integer, minimum: 1, maximum: 2147483647}
        durationMs: {type: integer, minimum: 0, maximum: 9007199254740991}
        statusCode: {type: integer, minimum: 0, maximum: 9007199254740991}
    TurnActivityTimeline:
      type: object
      additionalProperties: false
      required: [blockId, version, entries]
      properties:
        blockId: {const: activity-timeline}
        version: {const: 1}
        entries:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/TurnActivityEntry'}
        droppedCount: {type: integer, minimum: 0, maximum: 2147483647}
    TurnLastRoundUsage:
      type: object
      # The latest response-authoring agent round, never an internal
      # compaction call or a billed-but-discarded retry. This is the canonical
      # serving-route fact for finish presentation and the prompt-size fact
      # for the live context gauge. Fields remain optional so projections
      # written before route enrichment continue to decode.
      additionalProperties: false
      properties:
        round:
          oneOf:
            - {type: integer, minimum: 0, maximum: 2147483647}
            - {type: string, maxLength: 24}
        # Logical orchestration/fallback model and dispatcher-resolved wire
        # model are distinct because aliases may route to another model id.
        model: {type: string, maxLength: 512}
        resolvedModel: {type: string, maxLength: 512}
        providerId: {type: string, maxLength: 160}
        # keyName is a configured slot identifier, not the API credential.
        keyName: {type: string, maxLength: 160}
        keyTail: {type: string, maxLength: 32}
        tag: {type: string, maxLength: 80}
        tokensIn: {type: integer, minimum: 0, maximum: 9007199254740991}
        tokensOut: {type: integer, minimum: 0, maximum: 9007199254740991}
    TurnTimingOverBudgetSpan:
