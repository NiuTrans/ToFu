openapi: 3.1.0
info:
  title: Tofu Conversation Sync API
  version: 3.0.0
  description: >-
    Canonical command, snapshot, ordered-event, invalidation, and connection
    health contract for turn-native conversations. This file is the only
    authoring source for the Python and TypeScript generated artifacts.
x-tofu-contract: tofu.conversation-sync/v3
x-tofu-stream:
  cursor: opaque
  ordering: conversation-scoped-monotonic
  heartbeatIntervalMs: 15000
  reconnectGraceMs: 37500
  replayRetentionMs: 604800000
  eventSource: /api/v3/conversations/{conversationId}/events
  gapEvent: sync.reset_required
  streamClientIdQuery: streamClientId
  streamGenerationQuery: streamGeneration
  capacityStopStatus: 204
x-tofu-command-retry:
  maxAttempts: 3
  baseDelayMs: 250
  minDelayMs: 50
  maxDelayMs: 2000
  jitterRatio: 0.2
  httpStatuses: [502, 503, 504]
  storageCodes: [database_busy, database_unavailable, database_timeout]
  transportCodes: [network]
x-tofu-invariants:
  - A conversation mutation and its change-log row commit atomically.
  - A snapshot cursor is captured in the same read transaction as its rows.
  - Only the conversation event stream writes live turn projections.
  - Push and BroadcastChannel frames are invalidation hints, never projection data.
  - Projection patches apply only when baseRevision equals the local revision.
  - Existing turn projections are never embedded in retained incremental events.
  - Idempotent retries reuse one validated request snapshot and commandId.
  - A newer stream generation supersedes older connections from the same page and conversation on the receiving replica; the shared lease cap bounds cross-replica overlap.
  - Plan execution names one terminal source turn and projection revision; lane-tail CAS prevents executing a superseded plan.
paths:
  /api/v3/conversations/{conversationId}/sync:
    get:
      operationId: conversationSyncSnapshot
      x-tofu-client: snapshot
      x-tofu-client-fixed-query:
        segmentPayload: refs
        turnWindow: tail-96
        artifactHint: has-any
      x-tofu-contract: tofu.conversation-sync.snapshot/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: segmentPayload
          in: query
          required: false
          description: >-
            Snapshot representation. The default full form is compatible with
            independent clients; refs deduplicates exact terminal projection
            content and safely settled tool blocks against their sibling
            segment/round authorities. On completed Turns it also omits
            server-only provider replay and request diagnostics for the
            generated browser client.
          schema:
            type: string
            enum: [full, refs]
            default: full
        - name: turnWindow
          in: query
          required: false
          description: >-
            Bounded initial Turn profile. tail-96 returns at most 96 recent
            main-lane Turns for a linear conversation plus a history cursor;
            conversations with branch topology safely fall back to the full
            snapshot until lane-directory paging is available.
          schema:
            type: string
            enum: [full, tail-96]
            default: full
        - name: artifactHint
          in: query
          required: false
          description: >-
            Add the owner-scoped, bounded hasArtifacts hint to this snapshot.
            The generated browser opts in so an empty conversation can skip a
            separate artifact-list request; clients that omit the selector
            retain the older response shape.
          schema:
            type: string
            enum: [has-any]
      responses:
        '200':
          description: Authoritative turn snapshot and replay cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSyncSnapshot'
  /api/v3/conversations/{conversationId}/events:
    get:
      operationId: conversationSyncEvents
      x-tofu-client: eventsUrl
      x-tofu-contract: tofu.conversation-sync.events/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: streamClientId
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,63}$'
        - name: streamGeneration
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Ordered replayable Server-Sent Events.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ConversationSyncEvent'
        '204':
          description: Superseded or capacity-limited stream; native EventSource must stop reconnecting.
  /api/v3/conversations/{conversationId}/turns:
    post:
      operationId: conversationTurnCreate
      x-tofu-client: createTurn
      x-tofu-idempotent-retry: true
      x-tofu-client-timeout-ms: 0
      x-tofu-contract: tofu.conversation-sync.command.create-turn/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '200':
          description: Accepted or idempotently replayed command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnCommandResponse'
  /api/v3/conversations/{conversationId}/queue/{queueId}:
    delete:
      operationId: conversationQueueCancel
      x-tofu-client: cancelQueue
      x-tofu-contract: tofu.conversation-sync.command.queue-cancel/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/QueueId'
      responses:
        '200':
          description: Idempotently removed one not-yet-running queued Turn pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCancelResponse'
  /api/v3/conversations/{conversationId}/turns/history:
    get:
      operationId: conversationTurnHistoryPage
      x-tofu-client: turnPage
      x-tofu-client-fixed-query:
        segmentPayload: refs
      x-tofu-contract: tofu.conversation-sync.turn-page/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: laneId
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: syncSeq
          in: query
          required: true
          schema: {type: integer, minimum: 0, maximum: 9223372036854775807}
        - name: beforeOrdinal
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 9223372036854775807}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 256, default: 64}
        - name: segmentPayload
          in: query
          required: false
          schema:
            type: string
            enum: [full, refs]
            default: full
      responses:
        '200':
          description: Bounded owner/lane history page at one replay head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationTurnPage'
  /api/v3/conversations/{conversationId}/turns/{turnId}/images/{imageIndex}:
    get:
      operationId: conversationTurnImage
      x-tofu-client: turnImageUrl
      x-tofu-client-kind: url
      x-tofu-contract: tofu.conversation-sync.turn-image/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/TurnImageIndex'
        - name: projectionRevision
          in: query
          required: true
          description: >-
            Immutable projection fence from the refs snapshot that published
            this image URL. A changed Turn returns 409 instead of serving bytes
            from a different projection.
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
        - name: ownerScope
          in: query
          required: true
          description: >-
            Stable opaque cache partition for the authenticated owner. It is
            not an authorization credential; the repository still enforces
            explicit owner identity on every read.
          schema:
            type: string
            pattern: '^[0-9a-f]{24}$'
      responses:
        '200':
          description: One owner-scoped historical inline Turn image.
          headers:
            Cache-Control:
              schema: {type: string}
            ETag:
              schema: {type: string}
            X-Content-Type-Options:
              schema: {type: string, const: nosniff}
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/gif:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        '400': {description: Invalid revision, image index, or owner scope.}
        '404': {description: Conversation, Turn, or image not found for owner.}
        '409': {description: Projection revision is stale.}
  /api/v3/conversations/{conversationId}/turns/settled:
    post:
      operationId: conversationSettledTurnAppend
      x-tofu-client: appendSettledTurn
      x-tofu-idempotent-retry: true
      x-tofu-contract: tofu.conversation-sync.command.append-settled-turn/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendSettledTurnRequest'
      responses:
        '200':
          description: Appended or idempotently replayed terminal turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}:
    patch:
      operationId: conversationTurnUpdate
      x-tofu-client: updateTurn
      x-tofu-contract: tofu.conversation-sync.command.update-turn/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTurnRequest'
      responses:
        '200':
          description: Updated turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/perception:
    post:
      operationId: conversationTurnPerceptionRecord
      x-tofu-client: recordPerception
      x-tofu-contract: tofu.conversation-sync.command.record-perception/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPerceptionRequest'
      responses:
        '200':
          description: Recorded or idempotently replayed one bounded browser timing receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/plan/execute:
    post:
      operationId: conversationPlanExecute
      x-tofu-client: executePlan
      x-tofu-idempotent-retry: true
      x-tofu-client-timeout-ms: 0
      x-tofu-contract: tofu.conversation-sync.command.execute-plan/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutePlanRequest'
      responses:
        '200':
          description: Accepted or idempotently replayed execution of the exact proposed plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnCommandResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/attempts:
    post:
      operationId: conversationAttemptCreate
      x-tofu-client: createAttempt
      x-tofu-idempotent-retry: true
      x-tofu-client-timeout-ms: 0
      x-tofu-contract: tofu.conversation-sync.command.create-attempt/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttemptRequest'
      responses:
        '200':
          description: Accepted or idempotently replayed attempt command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnCommandResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/lanes:
    post:
      operationId: conversationLaneCreate
      x-tofu-client: createLane
      x-tofu-contract: tofu.conversation-sync.command.create-lane/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLaneRequest'
      responses:
        '200':
          description: Created branch lane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/lanes/{laneId}:
    delete:
      operationId: conversationLaneDelete
      x-tofu-client: deleteLane
      x-tofu-contract: tofu.conversation-sync.command.delete-lane/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/LaneId'
      responses:
        '200':
          description: Deleted branch lane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/file-changes/undo:
    post:
      operationId: conversationFileChangesUndo
      x-tofu-client: undoFileChanges
      x-tofu-idempotent-retry: true
      x-tofu-contract: tofu.conversation-sync.command.file-changes-undo/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileChangesCommandRequest'
      responses:
        '200':
          description: Undid this turn's file changes and updated its projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/file-changes/redo:
    post:
      operationId: conversationFileChangesRedo
      x-tofu-client: redoFileChanges
      x-tofu-idempotent-retry: true
      x-tofu-contract: tofu.conversation-sync.command.file-changes-redo/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileChangesCommandRequest'
      responses:
        '200':
          description: Reapplied this turn's file changes and updated its projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/delete:
    post:
      operationId: conversationTurnsDelete
      x-tofu-client: deleteTurns
      x-tofu-contract: tofu.conversation-sync.command.delete-turns/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTurnsRequest'
      responses:
        '200':
          description: Deleted turns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/attempts/{attemptId}/abort:
    post:
      operationId: conversationAttemptAbort
      x-tofu-client: abortAttempt
      x-tofu-contract: tofu.conversation-sync.command.abort-attempt/v1
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Abort request result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortAttemptResponse'
components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TurnImageIndex:
      name: imageIndex
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 19
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    LaneId:
      name: laneId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    QueueId:
      name: queueId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    TurnStatus:
      type: string
      description: >-
        Durable lifecycle state. pending means accepted but no execution
        worker has entered; running means a worker has physically entered the
        attempt; every other value is terminal.
      enum: [pending, running, completed, interrupted, truncated, failed]
    AttemptStatus:
      type: string
      description: >-
        Durable attempt lifecycle. A pending attempt may be unbound during
        dispatch preparation or bound/queued while waiting for a server task
        slot. Only the fenced physical worker-entry command changes it to
        running; every other value is terminal.
      enum: [pending, running, completed, interrupted, truncated, failed, superseded]
    TurnActor:
      type: string
      enum: [human, assistant, planner, critic, virtual_user]
    TurnToolResult:
      type: object
      additionalProperties: true
      properties:
        content: {}
        status: {type: string}
        rejection: {$ref: '#/components/schemas/TurnToolRejection'}
        _rejected:
          deprecated: true
          $ref: '#/components/schemas/TurnToolRejection'
        rejected:
          deprecated: true
          $ref: '#/components/schemas/TurnToolRejection'
    TurnToolRejection:
      type: object
      additionalProperties: true
      required: [kind]
      properties:
        kind: {type: string, minLength: 1, maxLength: 128}
        tool: {type: string, maxLength: 256}
        attempted: {type: string, maxLength: 256}
        reason: {type: string, maxLength: 4096}
        retryable: {type: boolean}
        suggestions:
          type: array
          maxItems: 16
          items: {type: string, maxLength: 256}
    ToolResultEvidence:
      type: object
      additionalProperties: false
      required:
        - contractVersion
        - resultContractVersion
        - status
        - projectionKind
        - truncated
        - rawBytes
        - visibleBytes
        - envelopeBytes
        - evidenceId
      properties:
        contractVersion:
          type: string
          enum: [tofu.tool-result-evidence/v1]
        resultContractVersion:
          type: string
          enum: [tofu.tool-result/v2]
        status: {type: string, enum: [ok, partial, error]}
        projectionKind:
          type: string
          enum: [text, json_value, summary_items, partial, error]
        truncated: {type: boolean}
        rawBytes: {type: integer, minimum: 0, maximum: 1000000000}
        visibleBytes: {type: integer, minimum: 0, maximum: 1000000000}
        envelopeBytes: {type: integer, minimum: 0, maximum: 1000000000}
        evidenceId: {type: string, maxLength: 128}
        artifactRef: {type: string, maxLength: 256}
        cursor: {type: string, maxLength: 256}
        freshness:
          type: object
          additionalProperties: false
          required: [observedAtMs, worldVersion]
          properties:
            observedAtMs: {type: integer, minimum: 0}
            worldVersion: {type: string, maxLength: 256}
        error:
          type: object
          additionalProperties: false
          required: [code, retryable, next_action, message]
          properties:
            code: {type: string, maxLength: 96}
            retryable: {type: boolean}
            next_action: {type: string, maxLength: 300}
            message: {type: string, maxLength: 500}
    TurnToolRound:
      type: object
      additionalProperties: true
      properties:
        attemptId: {type: string}
        taskId: {type: string}
        roundNum: {type: integer, minimum: 0}
        llmRound:
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
        toolCallId: {type: string}
        toolName: {type: string}
        toolArgs: {}
        toolContent: {}
        toolResultEvidence: {$ref: '#/components/schemas/ToolResultEvidence'}
        query: {type: string}
        status: {type: string}
        attentionKind:
          type: string
          enum: [routine, important, interactive]
          description: Stable semantic importance; live/error state is derived from status.
        parentToolCallId:
          type: string
          maxLength: 256
          description: Presentation-only parent edge for nested or recovery calls.
        rejection: {$ref: '#/components/schemas/TurnToolRejection'}
        _rejected:
          deprecated: true
          $ref: '#/components/schemas/TurnToolRejection'
        assistantContent: {type: string}
        thinking: {type: string}
        thinkingSignature: {type: string}
        result: {$ref: '#/components/schemas/TurnToolResult'}
        results:
          type: array
          items: {}
        tStart: {type: number}
        execStartTs: {type: number}
        deadlineTs: {type: number}
        tEnd: {type: number}
        _programSynthetic: {type: boolean}
        _programCallId: {type: string}
        programCode: {type: string}
        programStatus: {type: string}
        programSource: {type: string}
        programBackend: {type: string}
        programResult: {}
        programFingerprint: {type: string}
        childCallIds:
          type: array
          maxItems: 16
          items: {type: string}
        childToolNames:
          type: array
          maxItems: 16
          items: {type: string}
        programLimits:
          type: object
          additionalProperties: true
        _snapshotDocumentRefs:
          $ref: '#/components/schemas/SnapshotDocumentReferences'
          description: >-
            Snapshot-only references for repeated, immutable browser fields.
            The generated browser client resolves every entry from
            ConversationSyncSnapshot.sharedToolDocuments before TurnStore.
    SnapshotDocumentReferences:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 2
      properties:
        toolContent: {$ref: '#/components/schemas/SnapshotDocumentKey'}
        results: {$ref: '#/components/schemas/SnapshotDocumentKey'}
    SnapshotDocumentKey:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    SnapshotSharedToolDocuments:
      type: object
      minProperties: 1
      maxProperties: 256
      propertyNames: {$ref: '#/components/schemas/SnapshotDocumentKey'}
      additionalProperties: {}
    SnapshotRoundThinkingReferences:
      type: object
      minProperties: 1
      maxProperties: 4096
      additionalProperties:
        type: string
        minLength: 1
    SnapshotTurnProjectionReferences:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 2
      properties:
        content:
          type: string
          minLength: 1
        roundThinking:
          $ref: '#/components/schemas/SnapshotRoundThinkingReferences'
    SnapshotProjectionReferences:
      type: object
      minProperties: 1
      maxProperties: 4096
      additionalProperties:
        $ref: '#/components/schemas/SnapshotTurnProjectionReferences'
    TurnTextSegment:
      type: object
      additionalProperties: true
      required: [type, blockId, text]
      properties:
        type: {const: text}
        blockId: {type: string}
        attemptId: {type: string}
        taskId: {type: string}
        text: {type: string}
        translatedText: {type: string}
        deliverable: {type: boolean}
        terminal: {type: boolean}
        resumable: {type: boolean}
        llmRound:
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
    TurnThinkingSegment:
      type: object
      additionalProperties: true
      required: [type, blockId, text]
      properties:
        type: {const: thinking}
        blockId: {type: string}
        attemptId: {type: string}
        taskId: {type: string}
        text: {type: string}
        translatedText: {type: string}
        deliverable: {type: boolean}
        terminal: {type: boolean}
        signature: {type: string}
        llmRound:
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
    TurnToolUseSegment:
      type: object
      additionalProperties: true
      required: [type, blockId, id, name, result]
      properties:
        type: {const: tool_use}
        blockId: {type: string}
        attemptId: {type: string}
        taskId: {type: string}
        id: {type: string}
        name: {type: string}
        input: {}
        llmRound:
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
        result: {$ref: '#/components/schemas/TurnToolResult'}
        roundRef:
          type: string
          description: >-
            In a refs snapshot, resolves input and result from the unique
            sibling TurnToolRound whose toolCallId equals this value.
        _round: {$ref: '#/components/schemas/TurnToolRound'}
    TurnContentSegment:
      oneOf:
        - $ref: '#/components/schemas/TurnTextSegment'
        - $ref: '#/components/schemas/TurnThinkingSegment'
