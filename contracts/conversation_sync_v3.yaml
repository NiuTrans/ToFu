        coverageReason: {type: string, maxLength: 80}
        tStart: {type: integer, minimum: 0, maximum: 9007199254740991}
        tEnd:
          oneOf:
            - {type: integer, minimum: 0, maximum: 9007199254740991}
            - {type: 'null'}
        totalMs: {type: integer, minimum: 0, maximum: 9007199254740991}
        summary: {$ref: '#/components/schemas/TurnTimingSummary'}
        spans:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/TurnTimingSpan'}
        gaps:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/TurnTimingGap'}
        statusHistory:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/TurnTimingStatusEntry'}
        clientObservations:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/TurnClientPerceptionObservation'}
        droppedSpans: {type: integer, minimum: 0, maximum: 2147483647}
        droppedGaps: {type: integer, minimum: 0, maximum: 2147483647}
        statusDroppedCount: {type: integer, minimum: 0, maximum: 2147483647}
        clientObservationDroppedCount: {type: integer, minimum: 0, maximum: 2147483647}
        overBudgetDroppedCount: {type: integer, minimum: 0, maximum: 2147483647}
        detailCompacted: {type: boolean}
        compacted: {type: boolean}
    TurnProjection:
      type: object
      # This is the public backend/frontend ownership boundary. Historical
      # message overlays are normalized before decode; unknown top-level fields
      # fail closed instead of silently selecting a different renderer.
      additionalProperties: false
      properties:
        content: {type: string}
        thinking: {type: string}
        toolRounds:
          type: array
          items: {$ref: '#/components/schemas/TurnToolRound'}
        activityTimeline: {$ref: '#/components/schemas/TurnActivityTimeline'}
        timingTrace: {$ref: '#/components/schemas/TurnTimingTrace'}
        segments:
          type: array
          items: {$ref: '#/components/schemas/TurnContentSegment'}
        usage: {$ref: '#/components/schemas/JsonObject'}
        # Authoritative settled-cost snapshot, folded by the projection
        # authority from the turn's accumulated usage with the single
        # lib.cost formula. The finish footer / cost popover read this
        # top-level total; apiRounds stays the per-round breakdown ledger.
        cost: {$ref: '#/components/schemas/JsonObject'}
        apiRounds:
          type: array
          items: {$ref: '#/components/schemas/JsonObject'}
        lastRoundUsage: {$ref: '#/components/schemas/TurnLastRoundUsage'}
        model: {type: string}
        preset: {type: string}
        providerId: {type: string}
        routeSnapshot: {$ref: '#/components/schemas/RouteSnapshot'}
        # Deprecated request-only alias; public projections emit providerId.
        provider_id: {type: string}
        thinkingDepth:
          oneOf: [{type: string}, {type: number}]
        modifiedFiles: {type: integer, minimum: 0}
        modifiedFileList:
          type: array
          items: {$ref: '#/components/schemas/TurnFileChange'}
        fileChanges: {$ref: '#/components/schemas/TurnFileChangesBlock'}
        todoState: {$ref: '#/components/schemas/JsonObject'}

        waitingOn: {$ref: '#/components/schemas/JsonObject'}
        fallbackModel: {type: string}
        fallbackFrom: {type: string}
        fallbackReason: {type: string}
        fallbackKind: {type: string}
        translatedContent: {type: string}
        originalContent: {type: string}
        translation: {$ref: '#/components/schemas/TurnTranslation'}
        imageGeneration: {$ref: '#/components/schemas/TurnImageGeneration'}
        proposedPlan: {$ref: '#/components/schemas/TurnProposedPlan'}
        planExecution: {$ref: '#/components/schemas/TurnPlanExecution'}
        # Deprecated request aliases accepted during producer migration. The
        # projection normalizer maps them into TurnTranslation and never emits
        # them publicly.
        _translateDone: {type: boolean}
        _translateSkippedReason: {type: string}
        _translateModel: {type: string}
        _translateFailed: {}
        _translateError: {}
        _translateTaskId: {type: string}
        _translateStatus: {type: string}
        _translateStatusKind: {type: string}
        _translatePartial: {type: string}
        _translatePartialByRound: {$ref: '#/components/schemas/JsonObject'}
        _showingTranslation: {type: boolean}
        timestamp:
          oneOf: [{type: number}, {type: string}]
        images:
          type: array

          maxItems: 20
          items: {$ref: '#/components/schemas/TurnImageAttachment'}
        attachments:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/TurnMediaAttachment'}
        videos:
          type: array
          items: {$ref: '#/components/schemas/TurnVideoAttachment'}
        pdfTexts:
          type: array
          items: {$ref: '#/components/schemas/TurnDocumentAttachment'}
        convRefs:
          type: array
          items: {$ref: '#/components/schemas/TurnConversationReference'}
        replyQuotes:
          type: array
          items: {type: string}
        _branchLanes:
          type: array
          items: {$ref: '#/components/schemas/BranchLaneDescriptor'}
        orchestration: {$ref: '#/components/schemas/TurnOrchestration'}
        provenance: {$ref: '#/components/schemas/TurnProvenance'}
        origin: {$ref: '#/components/schemas/TurnOrigin'}
        contextSnapshot: {$ref: '#/components/schemas/TurnContextSnapshot'}
        compaction: {$ref: '#/components/schemas/TurnCompaction'}
        # Rewind history: newest-last entries, present only on turns whose
        # interrupted tail a resume rolled back (continue/checkpoint_resume).
        rolledBack:
          type: array
          maxItems: 4
          items: {$ref: '#/components/schemas/TurnRolledBackEntry'}
        # Deprecated legacy origin/context/compaction inputs. They are named so
        # old clients receive a deterministic migration path, then normalized
        # into the typed documents above before public output.
        _initiator: {type: string}
        _peerMessage: {type: boolean}
        _peerHuman: {type: boolean}
        _fromConv: {type: string}
        _brainDispatch: {type: boolean}
        _brainEpic: {$ref: '#/components/schemas/JsonObject'}
        _boardTaskId: {type: string}
        boardTaskId: {type: string}
        _isVirtualUser: {type: boolean}
        _autopilotRunId: {type: string}
        _proactive: {type: boolean}
        _proactiveTaskId: {type: string}
        _timer: {type: boolean}
        _swarmAutoContinue: {type: boolean}
        _ctx: {$ref: '#/components/schemas/JsonObject'}
        _isCompactionSummary: {type: boolean}
        _compactionArchiveId: {type: string}
        _estimatedPromptTokens: {type: integer, minimum: 0}
        _compactions:
          type: array
          items: {$ref: '#/components/schemas/JsonObject'}
        _foldedToolRounds: {type: integer, minimum: 0}
        # Internal Flow actor markers are consumed by authority writers and
        # stripped from public projection identity.
        _isFlowReview: {type: boolean}
        _isFlowPlanner: {type: boolean}
        _flowNodeId: {type: string}
        _flowRunId: {type: string}
        _flowIteration:
          oneOf: [{type: integer, minimum: 0}, {type: string}]
        _flowPlannerIteration:
          oneOf: [{type: integer, minimum: 0}, {type: string}]
        _flowApproved: {type: boolean}
        _flowNextPhase: {type: string}
        _isStuck: {type: boolean}
        error: {}
        _inboxInjects:
          type: array
          items: {$ref: '#/components/schemas/TurnMessageInjection'}
        _peerInjects:
          type: array
          items: {$ref: '#/components/schemas/TurnMessageInjection'}
        _userSteerInjects:
          type: array
          items: {$ref: '#/components/schemas/TurnMessageInjection'}
        _stallNudges:
          type: array
          items: {$ref: '#/components/schemas/TurnStallInjection'}
    TurnResumeOperation:
      type: string
      # ``answer_guidance`` resumes a turn whose replay prefix is blocked by a
      # still-unanswered ask_human round: the client's late answer completes
      # that tool call and the agent loop continues from it, so the model
      # never has to re-ask.
      enum: [continue, checkpoint_resume, regenerate, answer_guidance]
    TurnResumeOption:
      type: object
      additionalProperties: false
      required: [operation, anchor]
      properties:
        operation: {$ref: '#/components/schemas/TurnResumeOperation'}
        anchor: {$ref: '#/components/schemas/JsonObject'}
    TurnContinuation:
      type: object
      additionalProperties: false
      required: [turnId, attemptId]
      properties:
        turnId: {type: string}
        attemptId: {type: string}
    ProviderStreamState:
      type: string
      enum:
        - provider_finished
        - client_aborted
        - premature_close
        - malformed_stream
        - semantic_progress_timeout
        # Historical read compatibility; new writes use
        # semantic_progress_timeout.
        - no_actionable_output
        - empty_response
        - tool_payload_missing
        - unknown
    TurnOutcome:
      type: string
      enum: [completed, interrupted, truncated, failed]
    TurnTerminationEvidence:
      type: string
      enum:
        - provider_finish
        - legacy_finish
        - provider_limit
        - user_abort
        - provider_stream_failure
        - generation_error
        - missing_completion_evidence
        - external_authority
        - system_recovery
    TurnSettlement:
      type: object
      additionalProperties: false
      properties:
        outcome: {$ref: '#/components/schemas/TurnOutcome'}
        cause: {type: string}
        evidence: {$ref: '#/components/schemas/TurnTerminationEvidence'}
        streamState:
          oneOf:
            - $ref: '#/components/schemas/ProviderStreamState'
            - {type: 'null'}
        providerFinishReason:
          oneOf: [{type: string}, {type: 'null'}]
        error:
          oneOf:
            - $ref: '#/components/schemas/JsonObject'
            - {type: string}
            - {type: 'null'}
        resumeOptions:
          type: array
          items: {$ref: '#/components/schemas/TurnResumeOption'}
        continuation: {$ref: '#/components/schemas/TurnContinuation'}
    ConversationQueueItem:
      type: object
      additionalProperties: false
      required: [queueId, position, kind, priority, timestamp, text]
      properties:
        queueId: {type: string}
        position: {type: integer, minimum: 1}
        kind: {type: string}
        priority: {type: integer, minimum: 0}
        timestamp: {type: integer, minimum: 0}
        text: {type: string}
        sourceMessageId: {type: string}
        hasImages: {type: boolean}
        hasPdfs: {type: boolean}
        hasAttachments: {type: boolean}
        hasRefs: {type: boolean}
        hasQuotes: {type: boolean}
        isPeerMessage: {type: boolean}
        fromConv: {type: string}
        isPeerHuman: {type: boolean}
        inputTurnId: {type: string}
        outputTurnId: {type: string}
        attemptId: {type: string}
    ThreadScope:
      type: object
      additionalProperties: false
      required: [kind, ownerId, threadId]
      properties:
        kind:
          type: string
          enum: [conversation, diagnostic, paper_report]
        ownerId:
          oneOf: [{type: string}, {type: integer}]
        threadId: {type: string, minLength: 1, maxLength: 256}
    RawArchiveRef:
      type: object
      additionalProperties: false
      required: [summary, byteCount, sha256, integrity]
      properties:
        summary: {type: string}
        byteCount: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        integrity:
          type: string
          enum: [complete, partial]
        truncationReason:
          type: string
          enum: [attempt_limit, quota_exhausted, secret_scrubbed, transport_interrupted]
        archiveId: {type: string}
    QueueBinding:
      type: object
      additionalProperties: false
      required: [queueId, state]
      properties:
        queueId: {type: string, minLength: 1, maxLength: 256}
        state: {const: pending}
    TurnThreadSnapshot:
      type: object
      additionalProperties: false
      required: [scope, turns, attempts, queueItems]
      properties:
        scope: {$ref: '#/components/schemas/ThreadScope'}
        turns:
          type: array
          items: {$ref: '#/components/schemas/TurnRecord'}
        attempts:
          type: array
          items: {$ref: '#/components/schemas/AttemptRecord'}
        queueItems:
          type: array
          items: {$ref: '#/components/schemas/ConversationQueueItem'}
    AttemptOperation:
      type: string
      # ``ingest`` identifies already-settled assistant/planner imports. It is
      # observable in snapshots but is never accepted by CreateAttemptRequest.
      enum: [generate, continue, checkpoint_resume, regenerate, answer_guidance, ingest]
    ProjectionPatchPath:
      type: array
      items:
        oneOf:
          - type: string
          - type: integer
            minimum: 0
    ProjectionPatchOperation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, path, value]
          properties:
            op: {const: set}
            path: {$ref: '#/components/schemas/ProjectionPatchPath'}
            value: {}
        - type: object
          additionalProperties: false
          required: [op, path]
          properties:
            op: {const: remove}
            path: {$ref: '#/components/schemas/ProjectionPatchPath'}
        - type: object
          additionalProperties: false
          required: [op, path, value]
          properties:
            op: {const: append}
            path: {$ref: '#/components/schemas/ProjectionPatchPath'}
            value:
              type: array
              items: {}
        - type: object
          additionalProperties: false
          required: [op, path, length]
          properties:
            op: {const: truncate}
            path: {$ref: '#/components/schemas/ProjectionPatchPath'}
            length: {type: integer, minimum: 0}
        - type: object
          additionalProperties: false
          required: [op, path, value]
          properties:
            op: {const: append_text}
            path: {$ref: '#/components/schemas/ProjectionPatchPath'}
            value: {type: string}
    ProjectionPatch:
      type: object
      additionalProperties: false
      required: [version, baseRevision, targetRevision, operations]
      properties:
        version: {const: 1}
        baseRevision: {type: integer, minimum: 0}
        targetRevision: {type: integer, minimum: 0}
        operations:
          type: array
          maxItems: 20000
          items:
            $ref: '#/components/schemas/ProjectionPatchOperation'
    TurnProjectionChange:
      type: object
      additionalProperties: false
      required:
        - turnId
        - baseProjectionRevision
        - targetProjectionRevision
        - updatedAt
        - projectionPatch
      properties:
        turnId: {type: string}
        baseProjectionRevision: {type: integer, minimum: 0}
        targetProjectionRevision: {type: integer, minimum: 0}
        updatedAt: {type: integer, minimum: 0}
        projectionPatch: {$ref: '#/components/schemas/ProjectionPatch'}
    TurnRuntimeStateChange:
      type: object
      additionalProperties: false
      required: [turnId, status, currentAttemptId, settlement, updatedAt]
      properties:
        turnId: {type: string}
        status: {$ref: '#/components/schemas/TurnStatus'}
        actor: {$ref: '#/components/schemas/TurnActor'}
        kind: {type: string}
        currentAttemptId:
          oneOf: [{type: string}, {type: 'null'}]
        settlement: {$ref: '#/components/schemas/TurnSettlement'}
        updatedAt: {type: integer, minimum: 0}
    TurnRecord:
      type: object
      additionalProperties: false
      required:
        - turnId
        - presentationId
        - conversationId
        - laneId
        - ordinal
        - actor
        - kind
        - runId
        - status
        - projection
        - projectionRevision
        - settlement
        - createdAt
        - updatedAt
      properties:
        turnId: {type: string}
        presentationId:
          type: string
          description: Stable browser identity across optimistic acceptance, queue activation, and reconnect.
        conversationId: {type: string}
        laneId: {type: string}
        parentTurnId:
          oneOf: [{type: string}, {type: 'null'}]
        ordinal: {type: integer, minimum: 0}
        actor: {$ref: '#/components/schemas/TurnActor'}
        kind: {type: string}
        runId: {type: string}
        status: {$ref: '#/components/schemas/TurnStatus'}
        currentAttemptId:
          oneOf: [{type: string}, {type: 'null'}]
        projection: {$ref: '#/components/schemas/TurnProjection'}
        projectionRevision: {type: integer, minimum: 0}
        settlement: {$ref: '#/components/schemas/TurnSettlement'}
        createdAt: {type: integer, minimum: 0}
        updatedAt: {type: integer, minimum: 0}
    AttemptRecord:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - conversationId
        - turnId
        - commandId
        - taskId
        - operation
        - status
        - baseProjectionRevision
        - resumeAnchor
        - createdAt
      properties:
        attemptId: {type: string}
        conversationId: {type: string}
        turnId: {type: string}
        commandId: {type: string}
        taskId:
          type: string
          description: Empty during dispatch preparation; set once accepted by the task scheduler.
        operation: {$ref: '#/components/schemas/AttemptOperation'}
        status: {$ref: '#/components/schemas/AttemptStatus'}
        baseProjectionRevision: {type: integer, minimum: 0}
        resumeAnchor: {$ref: '#/components/schemas/JsonObject'}
        createdAt: {type: integer, minimum: 0}
        startedAt:
          description: Physical execution-worker entry time; null while pending/queued.
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
        queueBinding:
          description: Present only while this pending attempt is held in the queue lane.
          oneOf:
            - $ref: '#/components/schemas/QueueBinding'
            - {type: 'null'}
        settledAt:
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
    AttemptEvent:
      type: object
      additionalProperties: false
      required:
        - conversationId
        - turnId
        - attemptId
        - seq
        - projectionRevision
        - type
        - payload
      properties:
        conversationId: {type: string}
        turnId: {type: string}
        attemptId: {type: string}
        seq: {type: integer, minimum: 1}
        projectionRevision: {type: integer, minimum: 0}
        type:
          type: string
          enum: [projection_updated, interaction_request, status_changed, terminal_settlement]
        payload:
          type: object
          additionalProperties: true
          properties:
            projection: {$ref: '#/components/schemas/TurnProjection'}
            projectionPatch: {$ref: '#/components/schemas/ProjectionPatch'}
            turnState: {$ref: '#/components/schemas/TurnRuntimeStateChange'}
            status: {$ref: '#/components/schemas/TurnStatus'}
            dispatchState:
              type: string
              description: Scheduler detail subordinate to durable attempt status.
              enum: [queued, running]
            settlement: {$ref: '#/components/schemas/TurnSettlement'}
            request: {}
            turns:
              type: array
              items: {$ref: '#/components/schemas/TurnRecord'}
            attempts:
              type: array
              items: {$ref: '#/components/schemas/AttemptRecord'}
            phase: {}
    ConversationChangeType:
      type: string
      enum:
        - turn.upsert
        - turn.patch
        - turn.deleted
        - attempt.event
        - conversation.activity
    ConversationChange:
      type: object
      additionalProperties: false
      required: [contract, type, conversationId, syncSeq, occurredAt, payload]
      properties:
        contract: {const: tofu.conversation-sync.event/v1}
        type: {$ref: '#/components/schemas/ConversationChangeType'}
        conversationId: {type: string}
        syncSeq: {type: integer, minimum: 1}
        occurredAt: {type: integer, minimum: 0}
        turnId: {type: string}
        attemptId: {type: string}
        payload: {$ref: '#/components/schemas/JsonObject'}
    SyncHeartbeat:
      type: object
      additionalProperties: false
      required: [contract, type, conversationId, cursor, serverBootId, degraded]
      properties:
        contract: {const: tofu.conversation-sync.event/v1}
        type: {const: sync.heartbeat}
        conversationId: {type: string}
        cursor: {type: string}
        serverBootId: {type: string}
        degraded: {type: boolean}
        # True while the conversation's live task has authoritative frames
        # withheld on a storage-write wedge (durable-before-visible). Read-
        # side signal only — the write path itself cannot carry it.
        pushWithheld: {type: boolean}
    SyncResetRequired:
      type: object
      additionalProperties: false
      required: [contract, type, conversationId, cursor, reason]
      properties:
        contract: {const: tofu.conversation-sync.event/v1}
        type: {const: sync.reset_required}
        conversationId: {type: string}
        cursor: {type: string}
        reason:
          type: string
          enum: [cursor_expired, cursor_invalid, server_restarted, protocol_mismatch]
    ConversationSyncEvent:
      oneOf:
        - $ref: '#/components/schemas/ConversationChange'
        - $ref: '#/components/schemas/SyncHeartbeat'
        - $ref: '#/components/schemas/SyncResetRequired'
    ConversationSyncSnapshot:
      type: object
      additionalProperties: false
      required:
        - ok
        - contract
        - scope
        - conversationId
        - conversationRevision
        - syncSeq
        - cursor
        - serverBootId
        - heartbeatIntervalMs
        - settings
        - turns
        - attempts
        - queueItems
      properties:
        ok: {const: true}
        contract: {const: tofu.conversation-sync.snapshot/v1}
        scope: {$ref: '#/components/schemas/ThreadScope'}
        conversationId: {type: string}
        conversationRevision: {type: integer, minimum: 0}
        syncSeq: {type: integer, minimum: 0}
        cursor: {type: string}
        serverBootId: {type: string}
        heartbeatIntervalMs: {type: integer, minimum: 1000}
        settings: {$ref: '#/components/schemas/JsonObject'}
        turns:
          type: array
          items: {$ref: '#/components/schemas/TurnRecord'}
        attempts:
          type: array
          items: {$ref: '#/components/schemas/AttemptRecord'}
        queueItems:
          type: array
          items: {$ref: '#/components/schemas/ConversationQueueItem'}
        hasArtifacts:
          type: boolean
          description: >-
            True when the owner conversation has any live chat artifact.
            Present only when artifactHint=has-any; it carries no metadata and
            false authorizes the browser to project an empty artifact model.
        turnWindow:
          $ref: '#/components/schemas/ConversationTurnWindow'
        sharedToolDocuments:
          $ref: '#/components/schemas/SnapshotSharedToolDocuments'
          description: >-
            Request-local content-addressed values removed from repeated tool
            round fields. Omitted unless segmentPayload=refs finds a repeated
            document large enough to amortize its reference.
        snapshotProjectionRefs:
          $ref: '#/components/schemas/SnapshotProjectionReferences'
          description: >-
            Request-local per-Turn references for exact terminal projection
            fields duplicated by stable segments. The generated browser
            restores each value before TurnStore and discards this dictionary.
        # Same write-wedge signal as SyncHeartbeat.pushWithheld, shipped on
        # the snapshot so a client that (re)connects mid-wedge renders the
        # honest status instead of the generic waiting placeholder.
        pushWithheld: {type: boolean}
    ConversationTurnWindow:
      type: object
      additionalProperties: false
      required: [laneId, nextBeforeOrdinal, hasMore, totalTurns]
      properties:
        laneId: {const: main}
        nextBeforeOrdinal:
          oneOf:
            - {type: integer, minimum: 0, maximum: 9223372036854775807}
            - {type: 'null'}
        hasMore: {type: boolean}
        totalTurns: {type: integer, minimum: 0}
    ConversationTurnPage:
      type: object
      additionalProperties: false
      required:
        - ok
        - contract
        - conversationId
        - conversationRevision
        - syncSeq
        - cursor
        - laneId
        - beforeOrdinal
        - nextBeforeOrdinal
        - hasMore
        - totalTurns
        - turns
        - attempts
      properties:
        ok: {const: true}
        contract: {const: tofu.conversation-sync.turn-page/v1}
        conversationId: {type: string}
        conversationRevision: {type: integer, minimum: 0}
        syncSeq: {type: integer, minimum: 0}
        cursor: {type: string}
        laneId: {type: string, minLength: 1, maxLength: 128}
        beforeOrdinal: {type: integer, minimum: 0, maximum: 9223372036854775807}
        nextBeforeOrdinal:
          oneOf:
            - {type: integer, minimum: 0, maximum: 9223372036854775807}
            - {type: 'null'}
        hasMore: {type: boolean}
        totalTurns: {type: integer, minimum: 0}
        turns:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/TurnRecord'}
        attempts:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/AttemptRecord'}
        sharedToolDocuments:
          $ref: '#/components/schemas/SnapshotSharedToolDocuments'
        snapshotProjectionRefs:
          $ref: '#/components/schemas/SnapshotProjectionReferences'
    ConversationInvalidation:
      type: object
      additionalProperties: false
      required: [channel, taskId, contract, type, conversationId, cursorHint, userId]
      properties:
        channel: {const: notify}
        taskId: {type: string}
        contract: {const: tofu.conversation-sync.invalidation/v1}
        type: {const: conversation.invalidated}
        conversationId: {type: string}
        cursorHint: {type: string}
        userId:
          oneOf: [{type: string}, {type: integer}]
    ConnectionHealthState:
      type: string
      enum: [idle, connecting, live, recovering, degraded, offline, closed]
    ConnectionHealth:
      type: object
      additionalProperties: false
      required: [state, transport, observedAt, generation]
      properties:
        state: {$ref: '#/components/schemas/ConnectionHealthState'}
        transport:
          type: string
          enum: [conversation-sse, task-sse, push-websocket]
        observedAt: {type: number, minimum: 0}
        generation: {type: integer, minimum: 0}
        lastFrameAt: {type: number, minimum: 0}
        retryCount: {type: integer, minimum: 0}
        reason: {type: string}
    CreateTurnRequest:
      type: object
      additionalProperties: false
      required: [commandId, config]
      properties:
        commandId: {type: string, minLength: 1, maxLength: 256}
        inputTurn: {}
        message: {}
        config: {$ref: '#/components/schemas/JsonObject'}
        laneId: {type: string}
        parentTurnId:
          oneOf: [{type: string}, {type: 'null'}]
        kind: {type: string}
        actor: {$ref: '#/components/schemas/TurnActor'}
        runId: {type: string}
        injectMode:
          type: string
          enum: [steer, queue]
        conversation: {$ref: '#/components/schemas/JsonObject'}
    AppendSettledTurnRequest:
      type: object
      additionalProperties: false
      required: [commandId, actor, projection]
      properties:
        commandId: {type: string, minLength: 1, maxLength: 256}
        actor: {$ref: '#/components/schemas/TurnActor'}
        projection: {$ref: '#/components/schemas/TurnProjection'}
        kind: {type: string}
        status:
          type: string
          enum: [completed, interrupted, truncated, failed]
        settlement: {$ref: '#/components/schemas/TurnSettlement'}
        createdAt: {type: integer, minimum: 0}
        laneId: {type: string}
        runId: {type: string}
        conversation: {$ref: '#/components/schemas/JsonObject'}
    UpdateTurnRequest:
      type: object
      additionalProperties: false
      required: [expectedProjectionRevision, projection]
      properties:
        expectedProjectionRevision: {type: integer, minimum: 0}
        projection: {$ref: '#/components/schemas/TurnProjection'}
    RecordPerceptionRequest:
      type: object
      additionalProperties: false
      required: [observationId, attemptId, kind, clientId]
      properties:
        observationId:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:~-]*$'
        attemptId: {type: string, minLength: 1, maxLength: 128}
        kind:
          type: string
          enum: [phase_painted, terminal_painted, transport_degraded, transport_recovered]
        clientId: {type: string, minLength: 1, maxLength: 64}
        phase: {type: string, maxLength: 80}
        detailKey: {type: string, maxLength: 160}
        reason: {type: string, maxLength: 160}
        healthState: {$ref: '#/components/schemas/ConnectionHealthState'}
        visibility: {type: string, enum: [visible, hidden]}
        serverEmittedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        receivedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        paintedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        observedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        durationMs: {type: integer, minimum: 0, maximum: 9007199254740991}
        generation: {type: integer, minimum: 0, maximum: 2147483647}
        projectionRevision: {type: integer, minimum: 0, maximum: 9007199254740991}
        retryCount: {type: integer, minimum: 0, maximum: 2147483647}
        clientDroppedBefore: {type: integer, minimum: 0, maximum: 2147483647}
    FileChangesCommandRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedProjectionRevision]
      properties:
        commandId: {type: string, minLength: 1, maxLength: 256}
        expectedProjectionRevision: {type: integer, minimum: 0}
    ExecutePlanRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedProjectionRevision, planId, contextMode, config]
      properties:
        commandId: {type: string, minLength: 1, maxLength: 256}
        expectedProjectionRevision: {type: integer, minimum: 0}
        planId: {$ref: '#/components/schemas/PlanId'}
        contextMode:
          type: string
          enum: [current, fresh]
        config: {$ref: '#/components/schemas/JsonObject'}
    CreateAttemptRequest:
      type: object
      additionalProperties: false
      required: [commandId, operation, expectedProjectionRevision, config]
      properties:
        commandId: {type: string, minLength: 1, maxLength: 256}
        operation: {$ref: '#/components/schemas/TurnResumeOperation'}
        expectedProjectionRevision: {type: integer, minimum: 0}
        config: {$ref: '#/components/schemas/JsonObject'}
        resumeAnchor: {$ref: '#/components/schemas/JsonObject'}
        inputUpdate: {}
        # Optimistic-concurrency fence on the input Turn's projectionRevision;
        # senders MUST set it whenever inputUpdate is present.
        expectedInputProjectionRevision: {type: integer, minimum: 0}
        # Required when operation is ``answer_guidance``; rejected otherwise.
        humanResponse: {type: string, minLength: 1, maxLength: 32768}
    CreateLaneRequest:
      type: object
      additionalProperties: false
      required: [expectedProjectionRevision]
      properties:
        expectedProjectionRevision: {type: integer, minimum: 0}
        title: {type: string, maxLength: 500}
        anchorText: {type: string}
        parentSelection: {type: string}
        kind: {type: string}
    DeleteTurnsRequest:
      type: object
      additionalProperties: false
      required: [turnIds]
      properties:
        turnIds:
          type: array
          maxItems: 2000
          items: {type: string}
    TurnCommandResponse:
      type: object
      additionalProperties: true
      required: [ok, conversationId, conversationRevision]
      properties:
        ok: {const: true}
        conversationId: {type: string}
        conversationRevision: {type: integer, minimum: 0}
        cursor: {type: string}
        submittedTurn: {$ref: '#/components/schemas/TurnRecord'}
        turn: {$ref: '#/components/schemas/TurnRecord'}
        attempt: {$ref: '#/components/schemas/AttemptRecord'}
        idempotentReplay: {type: boolean}
        aborted: {type: boolean}
        steered: {type: boolean}
        injectionId: {type: string}
        blockId: {type: string}
        queued: {type: boolean}
        queueId: {type: string}
        position: {type: integer, minimum: 0}
        queueItem: {$ref: '#/components/schemas/ConversationQueueItem'}
        latestTurn: {$ref: '#/components/schemas/TurnRecord'}
        deletedTurnIds:
          description: >-
            Turns discarded atomically by this command. A regenerate retry
            supersedes the whole lane tail: every turn after the regenerated
            turn (plus branch lanes rooted inside that tail) is truncated in
            the same transaction, so no client can observe a half-rewritten
            history.
          type: array
          items: {type: string}
    QueueCancelResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - conversationId
        - conversationRevision
        - queueId
        - cancelled
        - deletedTurnIds
      properties:
        ok: {const: true}
        conversationId: {type: string}
        conversationRevision: {type: integer, minimum: 0}
        queueId: {type: string}
        cancelled: {type: boolean}
        inputTurn:
          oneOf:
            - $ref: '#/components/schemas/TurnRecord'
            - {type: 'null'}
        deletedTurnIds:
          type: array
          maxItems: 2
          items: {type: string}
    TurnMutationResponse:
      type: object
      additionalProperties: true
      required: [ok, conversationRevision]
      properties:
        ok: {const: true}
        conversationRevision: {type: integer, minimum: 0}
        cursor: {type: string}
        turn: {$ref: '#/components/schemas/TurnRecord'}
        turns:
          type: array
          items: {$ref: '#/components/schemas/TurnRecord'}
        deletedTurnIds:
          type: array
          items: {type: string}
    AbortAttemptResponse:
      type: object
      additionalProperties: true
      required: [ok]
      properties:
        ok: {const: true}
