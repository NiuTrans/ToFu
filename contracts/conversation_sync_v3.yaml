openapi: 3.1.0
info:
  title: Tofu Conversation Sync API
  version: 3.0.0
  description: >-
    Canonical command, snapshot, ordered-event, invalidation, and connection
    health contract for turn-native conversations. This file is the only
    authoring source for the Python and TypeScript generated artifacts.
x-tofu-contract: tofu.conversation-sync/v3
x-tofu-stream:
  cursor: opaque
  ordering: conversation-scoped-monotonic
  heartbeatIntervalMs: 15000
  reconnectGraceMs: 37500
  replayRetentionMs: 604800000
  eventSource: /api/v3/conversations/{conversationId}/events
  gapEvent: sync.reset_required
  streamClientIdQuery: streamClientId
  streamGenerationQuery: streamGeneration
  capacityStopStatus: 204
x-tofu-command-retry:
  maxAttempts: 3
  baseDelayMs: 250
  minDelayMs: 50
  maxDelayMs: 2000
  jitterRatio: 0.2
  httpStatuses: [502, 503, 504]
  storageCodes: [database_busy, database_unavailable, database_timeout]
  transportCodes: [network]
x-tofu-invariants:
  - A conversation mutation and its change-log row commit atomically.
  - A snapshot cursor is captured in the same read transaction as its rows.
  - Only the conversation event stream writes live turn projections.
  - Push and BroadcastChannel frames are invalidation hints, never projection data.
  - Projection patches apply only when baseRevision equals the local revision.
  - Existing turn projections are never embedded in retained incremental events.
  - Idempotent retries reuse one validated request snapshot and commandId.
  - A newer stream generation supersedes older connections from the same page and conversation on the receiving replica; the shared lease cap bounds cross-replica overlap.
  - Plan execution names one terminal source turn and projection revision; lane-tail CAS prevents executing a superseded plan.
paths:
  /api/v3/conversations/{conversationId}/sync:
    get:
      operationId: conversationSyncSnapshot
      x-tofu-client: snapshot
      x-tofu-contract: tofu.conversation-sync.snapshot/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Authoritative turn snapshot and replay cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSyncSnapshot'
  /api/v3/conversations/{conversationId}/events:
    get:
      operationId: conversationSyncEvents
      x-tofu-client: eventsUrl
      x-tofu-contract: tofu.conversation-sync.events/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: streamClientId
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,63}$'
        - name: streamGeneration
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Ordered replayable Server-Sent Events.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ConversationSyncEvent'
        '204':
          description: Superseded or capacity-limited stream; native EventSource must stop reconnecting.
  /api/v3/conversations/{conversationId}/turns:
    post:
      operationId: conversationTurnCreate
      x-tofu-client: createTurn
      x-tofu-idempotent-retry: true
      x-tofu-client-timeout-ms: 0
      x-tofu-contract: tofu.conversation-sync.command.create-turn/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '200':
          description: Accepted or idempotently replayed command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnCommandResponse'
  /api/v3/conversations/{conversationId}/turns/settled:
    post:
      operationId: conversationSettledTurnAppend
      x-tofu-client: appendSettledTurn
      x-tofu-idempotent-retry: true
      x-tofu-contract: tofu.conversation-sync.command.append-settled-turn/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendSettledTurnRequest'
      responses:
        '200':
          description: Appended or idempotently replayed terminal turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}:
    patch:
      operationId: conversationTurnUpdate
      x-tofu-client: updateTurn
      x-tofu-contract: tofu.conversation-sync.command.update-turn/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTurnRequest'
      responses:
        '200':
          description: Updated turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/plan/execute:
    post:
      operationId: conversationPlanExecute
      x-tofu-client: executePlan
      x-tofu-idempotent-retry: true
      x-tofu-client-timeout-ms: 0
      x-tofu-contract: tofu.conversation-sync.command.execute-plan/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutePlanRequest'
      responses:
        '200':
          description: Accepted or idempotently replayed execution of the exact proposed plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnCommandResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/attempts:
    post:
      operationId: conversationAttemptCreate
      x-tofu-client: createAttempt
      x-tofu-idempotent-retry: true
      x-tofu-client-timeout-ms: 0
      x-tofu-contract: tofu.conversation-sync.command.create-attempt/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttemptRequest'
      responses:
        '200':
          description: Accepted or idempotently replayed attempt command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnCommandResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/lanes:
    post:
      operationId: conversationLaneCreate
      x-tofu-client: createLane
      x-tofu-contract: tofu.conversation-sync.command.create-lane/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLaneRequest'
      responses:
        '200':
          description: Created branch lane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/lanes/{laneId}:
    delete:
      operationId: conversationLaneDelete
      x-tofu-client: deleteLane
      x-tofu-contract: tofu.conversation-sync.command.delete-lane/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/LaneId'
      responses:
        '200':
          description: Deleted branch lane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/file-changes/undo:
    post:
      operationId: conversationFileChangesUndo
      x-tofu-client: undoFileChanges
      x-tofu-idempotent-retry: true
      x-tofu-contract: tofu.conversation-sync.command.file-changes-undo/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileChangesCommandRequest'
      responses:
        '200':
          description: Undid this turn's file changes and updated its projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/{turnId}/file-changes/redo:
    post:
      operationId: conversationFileChangesRedo
      x-tofu-client: redoFileChanges
      x-tofu-idempotent-retry: true
      x-tofu-contract: tofu.conversation-sync.command.file-changes-redo/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/TurnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileChangesCommandRequest'
      responses:
        '200':
          description: Reapplied this turn's file changes and updated its projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/conversations/{conversationId}/turns/delete:
    post:
      operationId: conversationTurnsDelete
      x-tofu-client: deleteTurns
      x-tofu-contract: tofu.conversation-sync.command.delete-turns/v1
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTurnsRequest'
      responses:
        '200':
          description: Deleted turns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnMutationResponse'
  /api/v3/attempts/{attemptId}/abort:
    post:
      operationId: conversationAttemptAbort
      x-tofu-client: abortAttempt
      x-tofu-contract: tofu.conversation-sync.command.abort-attempt/v1
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Abort request result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbortAttemptResponse'
components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    LaneId:
      name: laneId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    TurnStatus:
      type: string
      enum: [pending, running, completed, interrupted, truncated, failed]
    AttemptStatus:
      type: string
      enum: [pending, running, completed, interrupted, truncated, failed, superseded]
    TurnActor:
      type: string
      enum: [human, assistant, planner, critic, virtual_user]
    TurnToolResult:
      type: object
      additionalProperties: true
      properties:
        content: {}
        status: {type: string}
        rejection: {$ref: '#/components/schemas/TurnToolRejection'}
        _rejected:
          deprecated: true
          $ref: '#/components/schemas/TurnToolRejection'
        rejected:
          deprecated: true
          $ref: '#/components/schemas/TurnToolRejection'
    TurnToolRejection:
      type: object
      additionalProperties: true
      required: [kind]
      properties:
        kind: {type: string, minLength: 1, maxLength: 128}
        tool: {type: string, maxLength: 256}
        attempted: {type: string, maxLength: 256}
        reason: {type: string, maxLength: 4096}
        retryable: {type: boolean}
        suggestions:
          type: array
          maxItems: 16
          items: {type: string, maxLength: 256}
    TurnToolRound:
      type: object
      additionalProperties: true
      properties:
        roundNum: {type: integer, minimum: 0}
        llmRound:
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
        toolCallId: {type: string}
        toolName: {type: string}
        toolArgs: {}
        toolContent: {}
        query: {type: string}
        status: {type: string}
        rejection: {$ref: '#/components/schemas/TurnToolRejection'}
        _rejected:
          deprecated: true
          $ref: '#/components/schemas/TurnToolRejection'
        assistantContent: {type: string}
        thinking: {type: string}
        thinkingSignature: {type: string}
        result: {$ref: '#/components/schemas/TurnToolResult'}
        results:
          type: array
          items: {}
        tStart: {type: number}
        execStartTs: {type: number}
        deadlineTs: {type: number}
    TurnTextSegment:
      type: object
      additionalProperties: true
      required: [type, blockId, text]
      properties:
        type: {const: text}
        blockId: {type: string}
        text: {type: string}
        translatedText: {type: string}
        deliverable: {type: boolean}
        terminal: {type: boolean}
        resumable: {type: boolean}
        llmRound:
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
    TurnThinkingSegment:
      type: object
      additionalProperties: true
      required: [type, blockId, text]
      properties:
        type: {const: thinking}
        blockId: {type: string}
        text: {type: string}
        translatedText: {type: string}
        deliverable: {type: boolean}
        terminal: {type: boolean}
        signature: {type: string}
        llmRound:
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
    TurnToolUseSegment:
      type: object
      additionalProperties: true
      required: [type, blockId, id, name, result]
      properties:
        type: {const: tool_use}
        blockId: {type: string}
        id: {type: string}
        name: {type: string}
        input: {}
        llmRound:
          oneOf: [{type: integer, minimum: 0}, {type: 'null'}]
        result: {$ref: '#/components/schemas/TurnToolResult'}
        _round: {$ref: '#/components/schemas/TurnToolRound'}
    TurnContentSegment:
      oneOf:
        - $ref: '#/components/schemas/TurnTextSegment'
        - $ref: '#/components/schemas/TurnThinkingSegment'
        - $ref: '#/components/schemas/TurnToolUseSegment'
    BranchLaneDescriptor:
      type: object
      additionalProperties: true
      required: [laneId]
      properties:
        laneId: {type: string}
        title: {type: string}
        label: {type: string}
        icon: {type: string}
        kind: {type: string}
        anchorText: {type: string}
        parentSelection: {type: string}
    TurnImageAttachment:
      type: object
      additionalProperties: true
      properties:
        attachmentId: {type: string}
        preview: {type: string}
        caption: {type: string}
        sizeKB:
          oneOf: [{type: number}, {type: string}]
        pdfPage: {type: integer, minimum: 1}
        pdfTotal: {type: integer, minimum: 1}
        pdfName: {type: string}
        pdfImageSource: {type: string}
    TurnVideoAttachment:
      type: object
      additionalProperties: true
      properties:
        video_id: {type: string}
        name: {type: string}
        video_url: {type: string}
        poster: {type: string}
        duration_s: {type: number, minimum: 0}
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
        frames:
          type: array
          items: {}
        frame_count: {type: integer, minimum: 0}
        avg_frame_bytes: {type: number, minimum: 0}
        transcript: {type: string}
        transcript_status: {type: string}
        transcript_model: {type: string}
        storyboard: {type: string}
        storyboard_model: {type: string}
    TurnDocumentAttachment:
      type: object
      additionalProperties: true
      properties:
        name: {type: string}
        text: {type: string}
        textLength: {type: integer, minimum: 0}
        pages: {type: integer, minimum: 0}
        isScanned: {type: boolean}
        method: {type: string}
    TurnConversationReference:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        title: {type: string}
    TurnInjectionPreview:
      type: object
      additionalProperties: true
      properties:
        text: {type: string}
        agentId: {type: string}
        fromConv: {type: string}
    TurnMessageInjection:
      type: object
      additionalProperties: true
      required: [blockId]
      properties:
        blockId: {type: string}
        round: {type: integer, minimum: 0}
        count: {type: integer, minimum: 0}
        agentIds:
          type: array
          items: {type: string}
        previews:
          type: array
          items: {$ref: '#/components/schemas/TurnInjectionPreview'}
    TurnStallInjection:
      type: object
      additionalProperties: true
      required: [blockId]
      properties:
        blockId: {type: string}
        round: {type: integer, minimum: 0}
        tool: {type: string}
        failedRound: {type: integer, minimum: 0}
        badge: {type: string}
        prompt: {type: string}
        max: {type: integer, minimum: 0}
    TurnFileChange:
      type: object
      additionalProperties: true
      required: [path]
      properties:
        path: {type: string}
        action: {type: string}
        root: {type: string}
        count: {type: integer, minimum: 0}
        ok: {type: boolean}
        pending: {type: boolean}
    TurnFileChangesBlock:
      type: object
      additionalProperties: false
      required: [blockId, count, files]
      properties:
        blockId: {type: string}
        taskId: {type: string}
        count: {type: integer, minimum: 0}
        state:
          type: string
          enum: [applied, undoing, undone, redoing, error]
        commandId: {type: string}
        error: {}
        effect: {$ref: '#/components/schemas/JsonObject'}
        files:
          type: array
          items: {$ref: '#/components/schemas/TurnFileChange'}
    TurnOrchestration:
      type: object
      additionalProperties: false
      properties:
        iteration:
          oneOf: [{type: integer, minimum: 0}, {type: string}]
        approved: {type: boolean}
        nextPhase: {type: string}
        stuck: {type: boolean}
        flowNodeId: {type: string}
        flowRunId: {type: string}
    TurnProvenance:
      type: object
      additionalProperties: false
      required: [blockId]
      properties:
        blockId: {type: string}
        memoryPrefetch: {$ref: '#/components/schemas/JsonObject'}
        mcpLoginHint: {$ref: '#/components/schemas/JsonObject'}
        preferencesApplied: {$ref: '#/components/schemas/JsonObject'}
        preferencesLearned:
          type: array
          items: {$ref: '#/components/schemas/JsonObject'}
        relatedConversations: {$ref: '#/components/schemas/JsonObject'}
    TurnBrainDispatch:
      type: object
      additionalProperties: false
      properties:
        epicId: {type: string}
        epicTitle: {type: string}
        originatorConv: {type: string}
        originatorTitle: {type: string}
        route: {type: string}
        method: {type: string}
        answered: {type: boolean}
    TurnOrigin:
      type: object
      additionalProperties: false
      required: [blockId, initiator]
      properties:
        blockId: {type: string}
        initiator:
          type: string
          enum: [human, autopilot, proactive, timer, brain, peer, operator, swarm]
        sourceConversationId: {type: string}
        peerHuman: {type: boolean}
        brain: {$ref: '#/components/schemas/TurnBrainDispatch'}
        autopilotRunId: {type: string}
        boardTaskId: {type: string}
        scheduledTaskId: {type: string}
    TurnContextSnapshot:
      type: object
      additionalProperties: false
      required: [blockId, snapshot]
      properties:
        blockId: {type: string}
        snapshot: {$ref: '#/components/schemas/JsonObject'}
    TurnCompaction:
      type: object
      additionalProperties: false
      required: [blockId]
      properties:
        blockId: {type: string}
        archiveId: {type: string}
        conversationId: {type: string}
        trigger: {type: string}
        timestamp: {type: integer, minimum: 0}
        tokensBefore: {type: integer, minimum: 0}
        tokensAfter: {type: integer, minimum: 0}
        messagesBefore: {type: integer, minimum: 0}
        messagesAfter: {type: integer, minimum: 0}
        reductionPercent: {type: integer, minimum: 0, maximum: 100}
        foldedToolRounds: {type: integer, minimum: 0}
        estimatedPromptTokens: {type: integer, minimum: 0}
    TurnTranslation:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending, completed, skipped, failed]
        model: {type: string}
        error: {}
        taskId: {type: string}
        statusMessage: {type: string}
        statusKind: {type: string}
        partial: {type: string}
        partialByRound: {$ref: '#/components/schemas/JsonObject'}
        sendFailure: {}
        skippedReason: {type: string}
    TurnImageGenerationResult:
      type: object
      additionalProperties: false
      required: [ok, prompt, model]
      properties:
        ok: {type: boolean}
        prompt: {type: string}
        model: {type: string}
        providerId: {type: string}
        aspectRatio: {type: string}
        resolution: {type: string}
        imageUrl: {type: string}
        remoteImageUrl: {type: string}
        fileSize: {type: integer, minimum: 0}
        elapsedSeconds: {type: number, minimum: 0}
        responseText: {type: string}
        error: {type: string}
        errorType: {type: string}
    TurnImageGeneration:
      type: object
      additionalProperties: false
      required: [blockId, mode, status, results]
      properties:
        blockId: {type: string}
        mode:
          type: string
          enum: [generate, edit, batch]
        status:
          type: string
          enum: [running, completed, failed, cancelled]
        results:
          type: array
          items: {$ref: '#/components/schemas/TurnImageGenerationResult'}
        error: {}
    PlanId:
      type: string
      pattern: '^plan_[0-9a-f]{24}$'
    TurnProposedPlan:
      type: object
      additionalProperties: false
      required: [blockId, planId, revision, format, text]
      properties:
        blockId: {const: proposed-plan}
        planId: {$ref: '#/components/schemas/PlanId'}
        revision: {const: 1}
        format: {const: markdown}
        text: {type: string, minLength: 1, maxLength: 64000}
    TurnPlanExecution:
      type: object
      additionalProperties: false
      required: [blockId, planId, sourceTurnId, sourceProjectionRevision, contextMode, planText]
      properties:
        blockId: {const: plan-execution}
        planId: {$ref: '#/components/schemas/PlanId'}
        sourceTurnId: {type: string}
        sourceProjectionRevision: {type: integer, minimum: 0}
        contextMode:
          type: string
          enum: [current, fresh]
        planText: {type: string, minLength: 1, maxLength: 64000}
    TurnActivityEntry:
      type: object
      additionalProperties: false
      required: [id, spanId, seq, occurredAt, kind, status, severity, count]
      properties:
        id: {type: string, minLength: 1, maxLength: 160}
        spanId: {type: string, minLength: 1, maxLength: 160}
        parentSpanId: {type: string, maxLength: 160}
        seq: {type: integer, minimum: 0, maximum: 9007199254740991}
        occurredAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        startedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        endedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        kind:
          type: string
          enum: [model, tool, status, error, system]
        status:
          type: string
          enum: [started, running, waiting, succeeded, failed, skipped, switched, aborted]
        severity:
          type: string
          enum: [info, warning, error]
        summary: {type: string, maxLength: 180}
        summaryKey: {type: string, maxLength: 160}
        summaryArgs: {$ref: '#/components/schemas/JsonObject'}
        detail: {type: string, maxLength: 400}
        detailKey: {type: string, maxLength: 160}
        detailArgs: {$ref: '#/components/schemas/JsonObject'}
        roundNum: {type: integer, minimum: 0, maximum: 9007199254740991}
        # 0-based model round this entry is anchored to for inline display
        # (roundNum is the 1-based R{n} request-tag round; llmRound = roundNum - 1).
        llmRound: {type: integer, minimum: 0, maximum: 9007199254740991}
        model: {type: string, maxLength: 160}
        providerId: {type: string, maxLength: 160}
        toolName: {type: string, maxLength: 160}
        toolCallId: {type: string, maxLength: 160}
        reasonCode: {type: string, maxLength: 160}
        action: {type: string, maxLength: 48}
        fromModel: {type: string, maxLength: 160}
        toModel: {type: string, maxLength: 160}
        requestTag: {type: string, maxLength: 80}
        phase: {type: string, maxLength: 80}
        # A completed context-compaction entry is an inspectable Turn fact.
        # These fields intentionally carry accounting only; transcript/archive
        # payloads stay behind the owner-scoped compaction endpoint.
        archiveId: {type: string, maxLength: 160}
        trigger: {type: string, maxLength: 80}
        tokenCountKind: {type: string, maxLength: 24}
        tokensBefore: {type: integer, minimum: 0, maximum: 9007199254740991}
        tokensAfter: {type: integer, minimum: 0, maximum: 9007199254740991}
        messagesBefore: {type: integer, minimum: 0, maximum: 9007199254740991}
        messagesAfter: {type: integer, minimum: 0, maximum: 9007199254740991}
        reductionPercent: {type: integer, minimum: 0, maximum: 100}
        # 'occurrences' marks a coalesced retry/recovery row: durationMs is the
        # sum of actual backoffs, never one continuous wall-clock wait.
        timingMode: {type: string, maxLength: 24}
        # Credential-free model-route diagnostics on model completion rows.
        routeId: {type: string, maxLength: 160}
        routeMode: {type: string, maxLength: 24}
        routeDecision: {type: string, maxLength: 80}
        failureStage: {type: string, maxLength: 80}
        count: {type: integer, minimum: 1, maximum: 2147483647}
        durationMs: {type: integer, minimum: 0, maximum: 9007199254740991}
        statusCode: {type: integer, minimum: 0, maximum: 9007199254740991}
    TurnActivityTimeline:
      type: object
