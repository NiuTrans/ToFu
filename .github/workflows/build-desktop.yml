# ═══════════════════════════════════════════════════════════════
#  Tofu (豆腐) — Desktop Installer Build
# ═══════════════════════════════════════════════════════════════
#
#  Triggered on:
#    - Push of a version tag (v*)
#    - Manual dispatch (workflow_dispatch)
#
#  Produces:
#    - Windows: Tofu-Setup-x.y.z-win64.exe (Inno Setup installer)
#    - macOS:   Tofu-x.y.z-macos.dmg       (disk image)
#    - Linux:   Tofu-x.y.z-linux.tar.gz    (portable archive)
#
#  All artifacts are uploaded to the GitHub Release.
#
# ═══════════════════════════════════════════════════════════════

name: Build Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (e.g. 0.10.0-beta1). Leave empty to read from VERSION file.'
        required: false
        type: string

permissions:
  contents: write   # needed for creating releases

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Read version ─────────────────────────────────────────────
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            echo "version=${{ inputs.version_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi

  # ── Windows ──────────────────────────────────────────────────
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    needs: version
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow psycopg2-binary

      - name: Generate icons
        run: python scripts/gen_desktop_icons.py

      - name: Build with PyInstaller
        run: pyinstaller tofu.spec

      - name: Create Inno Setup script
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > installer.iss << 'INNO_EOF'
          [Setup]
          AppName=Tofu
          AppVersion=${APP_VERSION}
          AppPublisher=Tofu Project
          AppPublisherURL=https://github.com/rangehow/ToFu
          DefaultDirName={autopf}\Tofu
          DefaultGroupName=Tofu
          UninstallDisplayIcon={app}\Tofu.exe
          OutputDir=installer_output
          OutputBaseFilename=Tofu-Setup-${APP_VERSION}-win64
          Compression=lzma2/ultra64
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          SetupIconFile=static\icons\tofu.ico
          PrivilegesRequired=lowest
          WizardStyle=modern

          [Files]
          Source: "dist\Tofu\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\Tofu"; Filename: "{app}\Tofu.exe"
          Name: "{autodesktop}\Tofu"; Filename: "{app}\Tofu.exe"; Tasks: desktopicon

          [Tasks]
          Name: desktopicon; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"
          Name: installbrowser; Description: "Download Browser Engine (~150 MB, recommended for web fetching)"; GroupDescription: "Optional Components (downloaded after install):"; Flags: checkedonce
          Name: installpg; Description: "Set up PostgreSQL database (~50 MB, recommended)"; GroupDescription: "Optional Components (downloaded after install):"; Flags: checkedonce

          [Run]
          Filename: "{app}\Tofu.exe"; Description: "Launch Tofu"; Flags: nowait postinstall skipifsilent
          Filename: "{app}\_internal\python.exe"; Parameters: "-m playwright install chromium"; Description: "Downloading Browser Engine..."; StatusMsg: "Installing Chromium browser engine..."; Flags: runhidden postinstall skipifnotsilent; Tasks: installbrowser
          INNO_EOF

          # Substitute env vars in the iss file
          sed -i "s/\${APP_VERSION}/$APP_VERSION/g" installer.iss

      - name: Build installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer_output/*.exe
          retention-days: 30

  # ── macOS ────────────────────────────────────────────────────
  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    needs: version
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow psycopg2-binary

      - name: Generate icons
        run: python scripts/gen_desktop_icons.py

      - name: Build with PyInstaller
        run: pyinstaller tofu.spec

      - name: Create DMG
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "Tofu" \
            --volicon "static/icons/tofu.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Tofu.app" 150 190 \
            --app-drop-link 450 190 \
            --hide-extension "Tofu.app" \
            "Tofu-${APP_VERSION}-macos.dmg" \
            "dist/Tofu.app/" \
          || {
            # Fallback: plain zip if create-dmg fails
            cd dist && zip -r "../Tofu-${APP_VERSION}-macos.zip" Tofu.app/
          }

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Tofu-*.dmg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload macOS ZIP (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: Tofu-*.zip
          if-no-files-found: ignore
          retention-days: 30

  # ── Linux ────────────────────────────────────────────────────
  build-linux:
    name: Linux Archive
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow psycopg2-binary

      - name: Generate icons
        run: python scripts/gen_desktop_icons.py

      - name: Build with PyInstaller
        run: pyinstaller tofu.spec

      - name: Create archive
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          tar czf "../Tofu-${APP_VERSION}-linux-x86_64.tar.gz" Tofu/

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: Tofu-*.tar.gz
          retention-days: 30

  # ── Release ──────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List artifacts
        run: find release-assets -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tofu v${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
