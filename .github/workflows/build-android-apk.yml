name: Build Android APK

# Builds the Android WebView client (android/) on every push/PR that touches
# it (so the build can never silently rot), and on an `android-v*` version tag
# ALSO assembles the release APK and publishes it as a GitHub Release asset
# ON THE rangehow/tofu-android REPO — which is what the Tofu web UI's
# "Mobile client" download link points at.
#
# ── Why `android-v*` and not `v*` ──
# This monorepo's desktop releases also use `v<VERSION>` tags (v0.14.x,
# created by build-desktop.yml's release step and by operator `export.py
# --bump` pushes). A bare `v*` trigger here would fire an APK build on every
# desktop release. The android-v* prefix keeps the two namespaces disjoint.
#
# ── Why the release lands on a DIFFERENT repo ──
# The download deep link is …/releases/latest/download/tofu-android.apk, and
# /releases/latest resolves to the CHRONOLOGICALLY NEWEST release in a repo.
# Publishing the APK here (ToFu) would let any newer desktop-only release
# shadow the link into a permanent 404. rangehow/tofu-android has no
# competing release stream, so the link can never be shadowed. That cross-repo
# publish needs a PAT (secrets.TOFU_ANDROID_RELEASE_PAT) with contents:write
# on rangehow/tofu-android; a missing PAT fails the release LOUDLY (below),
# never silently skips it.

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
    tags: ['android-v*']
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write   # release publishing (cross-repo uses the PAT, not GITHUB_TOKEN)

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the versionCode / keystore guards below can
          # diff against the previous android-v* tag's committed files.
          fetch-depth: 0

      # The release APK is signed with the COMMITTED android/app/debug.keystore.
      # If that file ever changes, in-place release updates silently break
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Fail every build whose keystore
      # sha256 differs from the previous android-v* tag's committed keystore.
      # Skips gracefully when no previous tag exists yet (pre-first-release).
      - name: "Guard: committed debug.keystore unchanged vs previous android-v* tag"
        run: |
          set -euo pipefail
          prev_tag="$(git tag --list 'android-v*' --sort=-v:refname | grep -v -x "${GITHUB_REF_NAME}" | head -1 || true)"
          if [ -z "$prev_tag" ]; then
            echo "No previous android-v* tag — skipping keystore hash guard."
            exit 0
          fi
          current_hash="$(sha256sum app/debug.keystore | awk '{print $1}')"
          prev_hash="$(git show "${prev_tag}:android/app/debug.keystore" | sha256sum | awk '{print $1}')"
          if [ "$current_hash" != "$prev_hash" ]; then
            echo "::error::app/debug.keystore changed since ${prev_tag} (${prev_hash} -> ${current_hash}). In-place release updates would break (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Do not change the committed keystore; a rotation requires a one-time uninstall by all users."
            exit 1
          fi
          echo "keystore sha256 unchanged vs ${prev_tag}: ${current_hash}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tofu-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # ── Release path (android-v* tag builds only) ──
      - name: "Guard: release PAT must exist"
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          RELEASE_PAT: ${{ secrets.TOFU_ANDROID_RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::secrets.TOFU_ANDROID_RELEASE_PAT is not set. The APK release publishes CROSS-REPO to rangehow/tofu-android (see workflow header); without a PAT with contents:write on that repo the release cannot happen. Set the secret and re-run."
            exit 1
          fi

      # versionCode is bumped manually in app/build.gradle.kts. Android refuses
      # a downgrade install, so on an android-v* tag build verify the current
      # versionCode is STRICTLY GREATER than the previous android-v* tag's.
      - name: "Guard: versionCode strictly greater than previous android-v* tag"
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          set -euo pipefail
          current="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$current" ]; then
            echo "::error::Could not parse versionCode from app/build.gradle.kts"
            exit 1
          fi
          prev_tag="$(git tag --list 'android-v*' --sort=-v:refname | grep -v -x "${GITHUB_REF_NAME}" | head -1 || true)"
          if [ -z "$prev_tag" ]; then
            echo "No previous android-v* tag — skipping versionCode guard (first release)."
            exit 0
          fi
          previous="$(git show "${prev_tag}:android/app/build.gradle.kts" | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' | head -1)"
          if [ -z "$previous" ]; then
            echo "::error::Could not parse versionCode from ${prev_tag}:android/app/build.gradle.kts"
            exit 1
          fi
          if [ "$current" -le "$previous" ]; then
            echo "::error::versionCode ${current} is not greater than ${prev_tag}'s versionCode ${previous}. Android refuses a downgrade install; bump versionCode in android/app/build.gradle.kts."
            exit 1
          fi
          echo "versionCode ${current} > previous ${previous} (${prev_tag})"
      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: ./gradlew assembleRelease --stacktrace

      # Pin the published asset to the EXACT name the Tofu backend's default
      # download URL points at (DEFAULT_MOBILE_CLIENT_URL → …/download/
      # tofu-android.apk). Gradle emits app-release[-unsigned].apk, which would
      # NOT match the deep link and give a permanent 404 — so we rename to the
      # canonical asset name here. Kept in lockstep with the backend constant by
      # tests/test_mobile_client_apk_url.py (asset name = 'tofu-android.apk').
      - name: Rename release APK to canonical asset name
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          shopt -u nullglob
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly ONE release APK, found ${#apks[@]}:"
            if [ "${#apks[@]}" -gt 0 ]; then
              printf '  - %s\n' "${apks[@]}"
            fi
            exit 1
          fi
          cp "${apks[0]}" "app/build/outputs/apk/release/tofu-android.apk"
          echo "Published asset will be: tofu-android.apk (from ${apks[0]})"

      # The release APK is ALREADY signed: android/app/build.gradle.kts binds
      # the release buildType to a FIXED, committed debug keystore
      # (android/app/debug.keystore), so assembleRelease produces a
      # directly-installable, update-compatible APK with NO repo-secret setup.
      # (Signing with the debug KEY does not make the build debuggable —
      # release stays isDebuggable=false.) Switch to a secret-backed
      # signingConfigs.release only before any Play Store submission.
      # See android/README.md "Release / cutting a version".
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          # CROSS-REPO on purpose — see the header. github.ref_name is the
          # android-vX.Y.Z tag; the action creates it in the target repo.
          repository: rangehow/tofu-android
          token: ${{ secrets.TOFU_ANDROID_RELEASE_PAT }}
          tag_name: ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/tofu-android.apk
          fail_on_unmatched_files: true
