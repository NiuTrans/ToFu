name: Build Android APK

# Debug/test builds are independent of private release credentials. Only an
# explicitly pushed android-v* tag can publish to the dedicated APK stream.
# Private keystore and certificate pin are repository/environment secrets;
# legacy public-debug-key APKs require the documented one-time migration.
on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
    tags: ['android-v*']
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tofu-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Stage private release signing key
        id: private_signing
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          TOFU_ANDROID_KEYSTORE_BASE64: ${{ secrets.TOFU_ANDROID_KEYSTORE_BASE64 }}
          TOFU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TOFU_ANDROID_KEYSTORE_PASSWORD }}
          TOFU_ANDROID_KEY_ALIAS: ${{ secrets.TOFU_ANDROID_KEY_ALIAS }}
          TOFU_ANDROID_KEY_PASSWORD: ${{ secrets.TOFU_ANDROID_KEY_PASSWORD }}
          TOFU_ANDROID_SIGNER_SHA256: ${{ secrets.TOFU_ANDROID_SIGNER_SHA256 }}
          RELEASE_PAT: ${{ secrets.TOFU_ANDROID_RELEASE_PAT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, sys
          required = ('TOFU_ANDROID_KEYSTORE_BASE64', 'TOFU_ANDROID_KEYSTORE_PASSWORD',
                      'TOFU_ANDROID_KEY_ALIAS', 'TOFU_ANDROID_KEY_PASSWORD',
                      'TOFU_ANDROID_SIGNER_SHA256', 'RELEASE_PAT')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              sys.exit('Private release configuration missing: ' + ', '.join(missing))
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tofu-android-release.jks'
          try:
              decoded = base64.b64decode(os.environ['TOFU_ANDROID_KEYSTORE_BASE64'], validate=True)
              fd = os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(decoded)
          except (ValueError, OSError):
              sys.exit('Could not stage the private signing key')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('keystore_path=' + str(key) + '\n')
          PY
      - name: Guard release source version and monotonic build
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from validate_release import validate_tag, validate_version_code
          source = Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
          code = int(re.search(r'versionCode\s*=\s*(\d+)', source).group(1))
          validate_tag(os.environ['GITHUB_REF_NAME'], version)
          tags = subprocess.check_output(['git', 'tag', '--list', 'android-v*', '--sort=-v:refname'], text=True).splitlines()
          previous = next((tag for tag in tags if tag != os.environ['GITHUB_REF_NAME']), None)
          published_code = json.loads(Path('published-release.json').read_text())['versionCode']
          previous_code = published_code
          if previous:
              old = subprocess.check_output(['git', 'show', previous + ':android/app/build.gradle.kts'], text=True)
              previous_code = int(re.search(r'versionCode\s*=\s*(\d+)', old).group(1))
              previous_code = max(previous_code, published_code)
          validate_version_code(code, previous_code)
          PY
      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          TOFU_ANDROID_KEYSTORE_PATH: ${{ steps.private_signing.outputs.keystore_path }}
          TOFU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TOFU_ANDROID_KEYSTORE_PASSWORD }}
          TOFU_ANDROID_KEY_ALIAS: ${{ secrets.TOFU_ANDROID_KEY_ALIAS }}
          TOFU_ANDROID_KEY_PASSWORD: ${{ secrets.TOFU_ANDROID_KEY_PASSWORD }}
          TOFU_ANDROID_SIGNER_SHA256: ${{ secrets.TOFU_ANDROID_SIGNER_SHA256 }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename release APK to canonical asset name
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo 'Expected exactly one release APK' >&2
            exit 1
          fi
          cp "${apks[0]}" app/build/outputs/apk/release/tofu-android.apk
      - name: Verify release identity and artifact
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          TOFU_ANDROID_KEYSTORE_PATH: ${{ steps.private_signing.outputs.keystore_path }}
          TOFU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TOFU_ANDROID_KEYSTORE_PASSWORD }}
          TOFU_ANDROID_KEY_ALIAS: ${{ secrets.TOFU_ANDROID_KEY_ALIAS }}
          TOFU_ANDROID_KEY_PASSWORD: ${{ secrets.TOFU_ANDROID_KEY_PASSWORD }}
          TOFU_ANDROID_SIGNER_SHA256: ${{ secrets.TOFU_ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          tools="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          python3 validate_release.py \
            --apk app/build/outputs/apk/release/tofu-android.apk \
            --apksigner "$tools/apksigner" --aapt "$tools/aapt" \
            --tag "$GITHUB_REF_NAME" \
            --receipt app/build/outputs/apk/release/published-release.json
      - name: Remove staged signing key
        if: always() && startsWith(github.ref, 'refs/tags/android-v')
        run: rm -f -- "$RUNNER_TEMP/tofu-android-release.jks"
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          repository: rangehow/tofu-android
          token: ${{ secrets.TOFU_ANDROID_RELEASE_PAT }}
          tag_name: ${{ github.ref_name }}
          files: |
            android/app/build/outputs/apk/release/tofu-android.apk
            android/app/build/outputs/apk/release/published-release.json
          fail_on_unmatched_files: true
