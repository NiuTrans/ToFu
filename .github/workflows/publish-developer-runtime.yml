name: Publish developer runtime

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  AGENT_IMAGE: ghcr.io/rangehow/tofu-agent

jobs:
  # A tag is a separate workflow invocation from branch CI.  Re-run the
  # release-input and public-agent image gates here so no package or image can
  # publish merely because an earlier branch build happened to be green.
  release-supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Gate release dependencies and deployment configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_HELM_KUBE_VERSION: "1.28.0"
          TRIVY_HELM_SET_STRING: "images.api.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,images.worker.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: codex,node_modules,static/vite,data,logs,outputs,.venv
          timeout: 15m
      - name: Gate checked-in release secrets at every scanner severity
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          skip-dirs: codex,node_modules,static/vite,data,logs,outputs,.venv
          timeout: 15m
      - name: Generate release-input CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: tofu-repository.cdx.json
          skip-dirs: codex,node_modules,static/vite,data,logs,outputs,.venv
          timeout: 15m
      - name: Upload release-input SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-runtime-sbom-${{ github.ref_name }}
          path: tofu-repository.cdx.json
          if-no-files-found: error

  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install checksum-pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Verify one release version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          expected = (root / 'VERSION').read_text().strip()
          tag = '${{ github.ref_name }}'
          assert tag == f'v{expected}', (tag, expected)
          assert tomllib.loads((root / 'pyproject.toml').read_text())['project']['version'] == expected
          assert tomllib.loads((root / 'clients/python/pyproject.toml').read_text())['project']['version'] == expected
          assert json.loads((root / 'clients/typescript/package.json').read_text())['version'] == expected
          PY

      - name: Build and validate Python distributions
        run: |
          uv lock --check
          uv sync --frozen --extra release --no-install-project
          # Python's isolated-interpreter mode prevents a prior local
          # ``build/`` output directory from shadowing the locked PyPA
          # ``build`` package. PEP 517 isolation stays disabled so
          # setuptools/wheel cannot be re-resolved outside uv.lock.
          uv run --no-sync python -I -m build --no-isolation --outdir dist/pypi
          uv run --no-sync python -I -m build --no-isolation \
            --outdir dist/pypi clients/python
          uv run --no-sync python -I -m twine check dist/pypi/*
          uv run --no-sync python scripts/check_developer_runtime_artifacts.py \
            dist/pypi/tofu_agent-*.whl \
            dist/pypi/tofu_agent-*.tar.gz

      - name: Build and pack TypeScript SDK
        working-directory: clients/typescript
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/npm"
          npm ci
          npm run build
          npm test
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist/npm"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-runtime-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  # Build once, push only to a run-unique staging tag, and make the immutable
  # OCI index/platform digests the authority for every scan and later promotion.
  # A failed gate may leave an unadvertised staging artifact for forensics, but
  # can never move a semver or latest tag.
  gate-agent-image:
    needs: [build-artifacts, release-supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.candidate.outputs.digest }}
      amd64_digest: ${{ steps.platforms.outputs.amd64_digest }}
      arm64_digest: ${{ steps.platforms.outputs.arm64_digest }}
      staging_ref: ${{ steps.staging.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select run-unique staging reference
        id: staging
        run: |
          echo "ref=${AGENT_IMAGE}:staging-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"
      - name: Push multi-platform agent candidate to staging
        id: candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.staging.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=tofu-agent
          cache-to: type=gha,mode=max,scope=tofu-agent
      - name: Resolve immutable index and platform digests
        id: platforms
        env:
          INDEX_DIGEST: ${{ steps.candidate.outputs.digest }}
          STAGING_REF: ${{ steps.staging.outputs.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          image = os.environ['AGENT_IMAGE']
          index_digest = os.environ['INDEX_DIGEST']
          digest_pattern = re.compile(r'^sha256:[0-9a-f]{64}$')
          if not digest_pattern.fullmatch(index_digest):
              raise SystemExit(f'invalid candidate index digest: {index_digest!r}')
          immutable_ref = f'{image}@{index_digest}'
          raw = subprocess.check_output([
              'docker', 'buildx', 'imagetools', 'inspect', '--raw', immutable_ref,
          ])
          index = json.loads(raw)
          selected = {}
          for descriptor in index.get('manifests', []):
              platform = descriptor.get('platform') or {}
              key = (platform.get('os'), platform.get('architecture'))
              if key not in {('linux', 'amd64'), ('linux', 'arm64')}:
                  continue
              digest = descriptor.get('digest')
              if not isinstance(digest, str) or not digest_pattern.fullmatch(digest):
                  raise SystemExit(f'invalid {key!r} manifest digest: {digest!r}')
              if key in selected:
                  raise SystemExit(f'duplicate platform descriptor: {key!r}')
              selected[key] = digest
          expected = {('linux', 'amd64'), ('linux', 'arm64')}
          if set(selected) != expected:
              raise SystemExit(
                  f'candidate platform set mismatch: {sorted(selected)!r}')

          outputs = {
              'amd64_digest': selected[('linux', 'amd64')],
              'arm64_digest': selected[('linux', 'arm64')],
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              for name, value in outputs.items():
                  stream.write(f'{name}={value}\n')
          evidence = {
              'schema': 'tofu.agent-image-digests/v1',
              'sourceRevision': os.environ['GITHUB_SHA'],
              'releaseTag': os.environ['GITHUB_REF_NAME'],
              'stagingRef': os.environ['STAGING_REF'],
              'immutableIndexRef': immutable_ref,
              'indexDigest': index_digest,
              'platforms': {
                  'linux/amd64': {
                      'digest': outputs['amd64_digest'],
                      'imageRef': f"{image}@{outputs['amd64_digest']}",
                  },
                  'linux/arm64': {
                      'digest': outputs['arm64_digest'],
                      'imageRef': f"{image}@{outputs['arm64_digest']}",
                  },
              },
          }
          Path('tofu-agent-digests.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Verify both published platform images are rootless
        env:
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64_digest }}
        run: |
          while read -r platform digest; do
            image_ref="${AGENT_IMAGE}@${digest}"
            docker pull --platform "$platform" "$image_ref"
            test "$(docker image inspect --format '{{.Config.User}}' "$image_ref")" = "tofu:tofu"
            docker run --rm --platform "$platform" "$image_ref" sh -eu -c \
              '! command -v pg_ctl; ! command -v initdb; ! command -v gcc; ! command -v g++'
          done <<EOF
          linux/amd64 ${AMD64_DIGEST}
          linux/arm64 ${ARM64_DIGEST}
          EOF
      - name: Generate linux/amd64 agent CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.AGENT_IMAGE }}@${{ steps.platforms.outputs.amd64_digest }}
          scanners: vuln
          format: cyclonedx
          output: tofu-agent-linux-amd64.cdx.json
          timeout: 15m
      - name: Gate linux/amd64 agent packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          image-ref: ${{ env.AGENT_IMAGE }}@${{ steps.platforms.outputs.amd64_digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          timeout: 15m
      - name: Generate linux/arm64 agent CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          image-ref: ${{ env.AGENT_IMAGE }}@${{ steps.platforms.outputs.arm64_digest }}
          scanners: vuln
          format: cyclonedx
          output: tofu-agent-linux-arm64.cdx.json
          timeout: 15m
      - name: Gate linux/arm64 agent packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          image-ref: ${{ env.AGENT_IMAGE }}@${{ steps.platforms.outputs.arm64_digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          timeout: 15m
      - name: Bind SBOM evidence to immutable platform digests
        env:
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64_digest }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence_path = Path('tofu-agent-digests.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          sboms = {}
          for platform, env_name, filename in (
              ('linux/amd64', 'AMD64_DIGEST', 'tofu-agent-linux-amd64.cdx.json'),
              ('linux/arm64', 'ARM64_DIGEST', 'tofu-agent-linux-arm64.cdx.json'),
          ):
              content = Path(filename).read_bytes()
              sboms[platform] = {
                  'digest': os.environ[env_name],
                  'file': filename,
                  'sha256': hashlib.sha256(content).hexdigest(),
              }
          evidence['sboms'] = sboms
          evidence_path.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with Path('tofu-agent-sbom.sha256').open('w', encoding='utf-8') as stream:
              for item in sboms.values():
                  stream.write(f"{item['sha256']}  {item['file']}\n")
          PY
      - name: Upload immutable agent evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-runtime-agent-evidence-${{ github.ref_name }}
          path: |
            tofu-agent-digests.json
            tofu-agent-linux-amd64.cdx.json
            tofu-agent-linux-arm64.cdx.json
            tofu-agent-sbom.sha256
          if-no-files-found: error

  publish-pypi:
    needs: [build-artifacts, gate-agent-image]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tofu-agent/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: developer-runtime-${{ github.ref_name }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi

  publish-npm:
    needs: [build-artifacts, gate-agent-image]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@rangehow/tofu-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: developer-runtime-${{ github.ref_name }}
          path: dist
      - name: Publish scoped SDK
        run: npm publish dist/npm/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-agent-image:
    needs: gate-agent-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/rangehow/tofu-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Promote the gated OCI index without rebuilding
        env:
          INDEX_DIGEST: ${{ needs.gate-agent-image.outputs.index_digest }}
          PROMOTION_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          immutable_source="${AGENT_IMAGE}@${INDEX_DIGEST}"
          mapfile -t tags < <(printf '%s\n' "$PROMOTION_TAGS" | sed '/^$/d')
          test "${#tags[@]}" -ge 1
          promotion_args=()
          for tag in "${tags[@]}"; do
            promotion_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${promotion_args[@]}" "$immutable_source"
          for tag in "${tags[@]}"; do
            promoted_digest="$(
              docker buildx imagetools inspect "$tag" \
                | awk '$1 == "Digest:" {print $2; exit}'
            )"
            test "$promoted_digest" = "$INDEX_DIGEST"
          done
      - name: Record promotion evidence
        env:
          INDEX_DIGEST: ${{ needs.gate-agent-image.outputs.index_digest }}
          AMD64_DIGEST: ${{ needs.gate-agent-image.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.gate-agent-image.outputs.arm64_digest }}
          STAGING_REF: ${{ needs.gate-agent-image.outputs.staging_ref }}
          PROMOTION_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              'schema': 'tofu.agent-image-promotion/v1',
              'sourceRevision': os.environ['GITHUB_SHA'],
              'releaseTag': os.environ['GITHUB_REF_NAME'],
              'stagingRef': os.environ['STAGING_REF'],
              'immutableIndexRef': (
                  f"{os.environ['AGENT_IMAGE']}@{os.environ['INDEX_DIGEST']}"),
              'indexDigest': os.environ['INDEX_DIGEST'],
              'platformDigests': {
                  'linux/amd64': os.environ['AMD64_DIGEST'],
                  'linux/arm64': os.environ['ARM64_DIGEST'],
              },
              'promotedTags': [
                  item for item in os.environ['PROMOTION_TAGS'].splitlines()
                  if item
              ],
          }
          Path('tofu-agent-promotion.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Upload agent promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-runtime-agent-promotion-${{ github.ref_name }}
          path: tofu-agent-promotion.json
          if-no-files-found: error

  github-release:
    needs: [publish-pypi, publish-npm, publish-agent-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: developer-runtime-${{ github.ref_name }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: developer-runtime-sbom-${{ github.ref_name }}
          path: dist/sbom
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: developer-runtime-agent-evidence-${{ github.ref_name }}
          path: dist/sbom
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: developer-runtime-agent-promotion-${{ github.ref_name }}
          path: dist/sbom
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/**/*
