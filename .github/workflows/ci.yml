name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Lint
        run: ruff check .

  # ── Unit tier (the bulk: ~5300 tests) — parallelised across workers ──
  # Split out from api/slow so the fast, DB-free bulk runs on its own and
  # in parallel. `-m unit` is the default CI tier (conftest auto-tags any
  # untagged test `unit`, so nothing silently escapes). `-n auto` fans the
  # tests across all runner cores; each xdist worker is its own process with
  # its own session-scoped throwaway SQLite DB, so isolation holds. The
  # 3.10↔3.12 endpoints of the supported range are covered (dropping 3.11
  # halves the matrix cost; a pure-Python bug that only bites 3.11 is
  # vanishingly unlikely between two green endpoints).
  test-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run unit tests (parallel)
        # `-n auto` on a 4-vCPU runner = 4 workers, and each worker spawns
        # node/jsdom subprocesses + ML-lib thread pools on top — measured
        # 2026-08-05 (f0a930e): the oversubscription starved timing- and
        # DB-writer-sensitive suites into sqlite-locked / 300s-timeout reds
        # that never reproduce on a fast box. `-n 2` halves the pressure;
        # `--dist loadscope` keeps each module's tests on one worker so
        # per-file fixtures can't interleave across workers.
        run: pytest -m "unit and not ci_serial" -n 2 --dist loadscope --timeout=300 -ra -q
      - name: Run timing-sensitive unit tests (serial)
        # Suites marked ci_serial assert locking / CAS / heartbeat-window
        # behaviour — even modest CPU contention flips them (they pass
        # reliably on any non-starved box). They run SERIALLY here, with a
        # longer timeout, after the parallel bulk.
        run: pytest -m "unit and ci_serial" --timeout=600 -ra -q

  # ── API integration tier (needs a DB; smaller, ~140 tests) ──
  # These boot the real app + hit routes. Run parallel too, but on a single
  # Python version — an integration-layer bug won't be version-specific.
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run API tests (parallel)
        run: pytest -m api -n auto --dist worksteal --timeout=300 -ra -q

  # ── Slow tier (endpoint-loop integration; ~90s each) — opt-in, serial ──
  # Kept OFF the critical `unit`/`api` path so a green PR isn't gated on
  # multi-minute orchestration loops. Non-blocking (continue-on-error) but
  # visible, and still parallelised.
  test-slow:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run slow tests
        run: pytest -m slow -n 4 --dist worksteal --timeout=600 -ra -q

  # ── Frontend tests (jsdom harnesses + tsc --checkJs ratchet) ──
  # The Python `test` job above has no Node, so every tests/test_frontend_*.py
  # silently pytest.skip()s there. This job installs Node + the JS dev-deps so
  # the jsdom harnesses and the type-check ratchet actually execute. `-ra`
  # surfaces any residual skips so a missing dep can't hide a whole suite again.
  frontend:
    runs-on: ubuntu-latest
    # P0-1 (docs/TESTING_STRATEGY.md §4): this lane PROMISES to run the
    # frontend suites — a missing node/jsdom must turn the lane red, never
    # silently skip 467 suites to green.
    env:
      TOFU_REQUIRE_FRONTEND: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JS dev-deps
        run: npm ci || npm install
      - name: Install package + test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run frontend tests (parallel)
        # Each jsdom test shells out to a `node` subprocess, so it's dominated
        # by process-spawn latency and fans out cleanly across workers.
        # ``--dist loadfile`` (NOT worksteal) is REQUIRED: several NC tests write
        # a FIXED-NAME temp copy of a shipped source file into tests/ (e.g.
        # _brain_tool_render_nc_copy.js), so two tests from the SAME file must
        # not run on different workers concurrently — worksteal distributes by
        # test and made them clobber each other's copy (ENOENT / stale content).
        # loadfile keeps every file's tests on one worker while still fanning
        # files across workers.
        run: pytest tests/test_frontend_*.py -n auto --dist loadfile --timeout=180 -ra

  # ── End-to-end smoke (real Quart/Hypercorn app + real headless Chromium) ──
  # Boots the actual app on an ephemeral port with a STUB LLM (no API key /
  # no network) and drives a real browser to it — asserting the served bundle
  # loaded, streaming rendered, and a tool round rendered. This is the only
  # lane that catches INTEGRATION-class bugs (bundler allowlist, SSE→render)
  # that jsdom unit harnesses structurally cannot. CI runners are root, so
  # `playwright install --with-deps chromium` installs the GUI libs cleanly;
  # the conftest LD_LIBRARY_PATH bootstrap is a no-op there (libs already on
  # the system) and the rootless-conda fallback for shared dev nodes.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install playwright
      - name: Install Chromium + system deps
        run: python -m playwright install --with-deps chromium
      - name: Run E2E smoke + critical journeys
        run: pytest tests/test_e2e_smoke.py tests/test_e2e_journeys.py -m visual -ra
